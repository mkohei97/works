<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1B1030">
<title>HIRO 予約台帳（見本）</title>
<meta name="description" content="予約台帳の見本です。お名前は架空で、内容は端末の中だけに保存されます。">
<style>body{margin:0}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Noto+Sans+JP:wght@400;500;700&amp;family=Shippori+Mincho:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1B1030}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
:focus-visible{outline:3px solid #FFFFFF;outline-offset:2px}
h1,h2,h3,button{word-break:auto-phrase}
p,li,dd{text-wrap:pretty}
@keyframes tw{0%,100%{opacity:.12;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes shimmer{from{background-position:120% 50%}to{background-position:-120% 50%}}
@keyframes glow{0%,100%{box-shadow:0 0 10px rgba(217,179,106,.3)}50%{box-shadow:0 0 24px rgba(217,179,106,.7)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes phase{0%,100%{opacity:.4}50%{opacity:1}}
.star{position:absolute;border-radius:50%;background:#FFF4D6;animation:tw 4s ease-in-out infinite;will-change:opacity,transform}
.gold{background:linear-gradient(100deg,#D9B36A 0%,#D9B36A 38%,#FFF6DC 50%,#D9B36A 62%,#D9B36A 100%);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 6s linear infinite}
.btn-gold{animation:glow 3.4s ease-in-out infinite}
.ph{animation:phase 4s ease-in-out infinite}
.tap{transition:transform .15s,background-color .2s,color .2s}.tap:active{transform:scale(.97)}
.intro>*{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
.intro>*:nth-child(2){animation-delay:.08s}.intro>*:nth-child(3){animation-delay:.16s}.intro>*:nth-child(4){animation-delay:.24s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
<style>
:root{color-scheme:dark}
html{-webkit-text-size-adjust:100%;background:#1B1030}
@media (prefers-reduced-motion:no-preference){button{transition:background-color .15s,color .15s,border-color .15s}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div id="top" style="min-height: 100vh; background: #1B1030; color: #F1ECFA; font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif; font-weight: 400; font-size: 16px; line-height: 1.8; line-break: strict; overflow-x: hidden">

<div style="background: #120A22; color: #EBD3A0; padding: 8px 16px; font-size: 14px; line-height: 1.6; text-align: center">見本の予約台帳です。お客様のお名前は架空で、内容はこの端末の中だけに保存されます。</div>

<header style="position: relative; overflow: hidden; background: linear-gradient(180deg, #24133F 0%, #1B1030 100%); border-bottom: 1px solid #4B3A70">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="0">
<span class="star" style="left: {{s.x}}; top: {{s.y}}; width: {{s.s}}; height: {{s.s}}; animation-duration: {{s.d}}; animation-delay: {{s.dl}}"></span>
</sc-for>
</div>
<div style="position: relative; max-width: 860px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px; min-width: 0">
<svg viewBox="0 0 44 44" aria-hidden="true" style="width: 42px; height: 42px; flex: 0 0 auto"><circle cx="22" cy="22" r="20.5" fill="none" stroke="#D9B36A" stroke-width="1"></circle><path d="M28 10a12.5 12.5 0 1 0 0 24a15 15 0 0 1 0-24z" fill="#D9B36A"></path><circle cx="30" cy="22" r="2.6" fill="#D9B36A"></circle><path d="M30 16.4v2M30 25.6v2M24.4 22h2M33.6 22h2M26 18l1.4 1.4M32.6 24.6L34 26M34 18l-1.4 1.4M27.4 24.6L26 26" stroke="#D9B36A" stroke-width="1" stroke-linecap="round"></path></svg>
<div style="min-width: 0; line-height: 1.3"><p class="gold" style="margin: 0; display: inline-block; font-family: 'Cormorant Garamond', 'Shippori Mincho', serif; font-size: 22px; font-weight: 600; letter-spacing: .22em">HIRO</p><h1 style="margin: 0; font-family: 'Shippori Mincho', 'Yu Mincho', serif; font-size: 22px; font-weight: 500; letter-spacing: .14em">予約台帳</h1></div>
</div>
<button type="button" class="tap btn-gold" onClick="{{go.add}}" style="flex: 0 0 auto; min-height: 50px; padding: 0 20px; border: 0; border-radius: 999px; background: #D9B36A; color: #1B1030; font-size: 16px; font-weight: 700; letter-spacing: .04em">＋ 予約を足す</button>
</div>
</header>

<sc-if value="{{is.list}}" hint-placeholder-val="{{true}}">
<main class="intro" style="max-width: 860px; margin: 0 auto; padding: 20px 16px 60px">

<section aria-label="いまの状況" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="3">
<div style="padding: 12px 10px 10px; background: #261744; border: 1px solid {{t.bd}}; border-radius: 14px; text-align: center; line-height: 1.4"><p style="margin: 0; font-size: 14px; color: #E3DAF5">{{t.k}}</p><p style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 600; line-height: 1.15; color: {{t.fg}}">{{t.n}}<span style="margin-left: 4px; font-family: 'Noto Sans JP', sans-serif; font-size: 14px; font-weight: 500; color: #C9BDE3">件</span></p></div>
</sc-for>
</section>

<section style="margin-top: 20px">
<div aria-hidden="true" style="display: flex; justify-content: center; gap: 10px; margin: 0 0 14px">
<sc-for list="{{phases}}" as="p" hint-placeholder-count="5"><span class="ph" style="width: 11px; height: 11px; border-radius: 50%; border: 1px solid #D9B36A; background: {{p.bg}}; box-shadow: {{p.sh}}; animation-delay: {{p.dl}}"></span></sc-for>
</div>
<div role="group" aria-label="表示する予約" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{filters}}" as="t" hint-placeholder-count="3">
<button type="button" class="tap" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="min-height: 46px; padding: 0 18px; border: 1px solid #D9B36A; border-radius: 999px; background: {{t.bg}}; color: {{t.fg}}; font-size: 15px; font-weight: 700">{{t.label}}</button>
</sc-for>
</div>
<div role="group" aria-label="入口で絞り込む" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px">
<span style="font-size: 14px; color: #C9BDE3">入口</span>
<sc-for list="{{srcs}}" as="t" hint-placeholder-count="4">
<button type="button" class="tap" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="min-height: 44px; padding: 0 14px; border: 1px solid #8E7DB3; border-radius: 999px; background: {{t.bg}}; color: {{t.fg}}; font-size: 14px; font-weight: 700">{{t.label}}</button>
</sc-for>
</div>
</section>

<section aria-label="予約の一覧" style="margin-top: 16px; display: flex; flex-direction: column; gap: 12px">
<sc-if value="{{is.empty}}" hint-placeholder-val="{{false}}"><p style="margin: 0; padding: 24px 16px; background: #261744; border: 1px dashed #8E7DB3; border-radius: 14px; font-size: 15px; color: #C9BDE3; text-align: center">当てはまる予約はありません。</p></sc-if>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<article style="padding: 16px 16px 14px; background: #261744; border: 1px solid #4B3A70; border-left: 5px solid {{r.bar}}; border-radius: 14px; opacity: {{r.op}}">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px">
<p style="margin: 0; font-family: 'Shippori Mincho', 'Yu Mincho', serif; font-size: 20px; font-weight: 500; line-height: 1.5; letter-spacing: .04em">{{r.day}}<span style="margin-left: 10px; color: #EBD3A0">{{r.time}}〜</span><span style="margin-left: 8px; font-family: 'Noto Sans JP', sans-serif; font-size: 15px; color: #C9BDE3">{{r.len}}</span></p>
<p style="margin: 0; display: flex; flex-wrap: wrap; gap: 6px"><span style="padding: 0 10px; border: 1px solid {{r.srcFg}}; border-radius: 999px; color: {{r.srcFg}}; font-size: 14px; font-weight: 700; line-height: 1.9">{{r.src}}</span><span style="padding: 0 10px; border-radius: 999px; background: {{r.stBg}}; color: {{r.stFg}}; font-size: 14px; font-weight: 700; line-height: 2">{{r.status}}</span></p>
</div>
<p style="margin: 6px 0 0; font-size: 18px; font-weight: 700">{{r.name}}<span style="margin-left: 4px; font-size: 14px; font-weight: 500; color: #E3DAF5">さま</span></p>
<dl style="margin: 4px 0 0; display: grid; grid-template-columns: 5.2em minmax(0, 1fr); gap: 2px 10px; font-size: 15px; line-height: 1.7">
<dt style="color: #C9BDE3">占い</dt><dd style="margin: 0">{{r.kinds}}</dd>
<dt style="color: #C9BDE3">ご連絡先</dt><dd style="margin: 0; overflow-wrap: anywhere">{{r.contact}}</dd>
<dt style="color: #C9BDE3">メモ</dt><dd style="margin: 0">{{r.body}}</dd>
</dl>
<sc-if value="{{r.hasDm}}" hint-placeholder-val="{{false}}">
<div style="margin-top: 10px; padding: 12px 14px; background: #1B1030; border: 1px dashed #A9D4FF; border-radius: 10px">
<p style="margin: 0; font-size: 14px; font-weight: 700; color: #A9D4FF">届いたDM</p>
<p style="margin: 2px 0 6px; font-size: 15px; line-height: 1.7">{{r.dm}}</p>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #C9BDE3">（案）DMの文から、日にち・時間・長さを自動で読み取って、仮の予約として載せます。この機能は、まだ動いていません。</p>
</div>
</sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px">
<button type="button" class="tap" onClick="{{r.a1}}" style="flex: 1 1 140px; min-height: 46px; border: 1px solid #D9B36A; border-radius: 999px; background: {{r.a1Bg}}; color: {{r.a1Fg}}; font-size: 15px; font-weight: 700">{{r.a1Label}}</button>
<button type="button" class="tap" onClick="{{r.a2}}" style="flex: 1 1 110px; min-height: 46px; border: 1px solid #8E7DB3; border-radius: 999px; background: transparent; color: #F1ECFA; font-size: 15px; font-weight: 700; display: {{r.a2Disp}}">{{r.a2Label}}</button>
</div>
</article>
</sc-for>
</section>

<section style="margin-top: 28px; padding: 20px 18px; background: #261744; border: 1px solid #4B3A70; border-radius: 14px">
<h2 style="margin: 0 0 8px; font-family: 'Shippori Mincho', 'Yu Mincho', serif; font-size: 20px; font-weight: 500; line-height: 1.6; letter-spacing: .06em; color: #EBD3A0">この台帳でできること</h2>
<ul style="margin: 0; padding: 0 0 0 1.2em; font-size: 15px; line-height: 1.9; color: #E3DAF5">
<li>ホームページのフォームから入った予約が、「返事待ち」で自動で載ります。</li>
<li>InstagramのDMで決まった予約は、「＋ 予約を足す」から入れます。入口が「Instagram」で残ります。</li>
<li>台帳に入っている日時は、ホームページのフォームで「予約済み」になり、同じ時間に重なりません。</li>
<li>本番では、HIROさんだけが開けるようにし、新しい予約が入ったらお知らせが届く形にします。</li>
</ul>
<button type="button" class="tap" onClick="{{go.reset}}" style="margin-top: 14px; min-height: 46px; padding: 0 18px; border: 1px solid #8E7DB3; border-radius: 999px; background: transparent; color: #F1ECFA; font-size: 15px; font-weight: 700">見本のデータに戻す</button>
</section>

</main>
</sc-if>

<sc-if value="{{is.add}}" hint-placeholder-val="{{false}}">
<main class="intro" style="max-width: 640px; margin: 0 auto; padding: 26px 16px 68px">
<div>
<h2 style="margin: 0 0 4px; font-family: 'Shippori Mincho', 'Yu Mincho', serif; font-size: 28px; font-weight: 500; line-height: 1.5; letter-spacing: .08em">予約を足す</h2>
<p style="margin: 0 0 18px; font-size: 15px; color: #E3DAF5">InstagramのDMなど、ホームページの外で決まった予約を入れます。</p>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">

<section style="padding: 22px 18px; background: #261744; border: 1px solid #4B3A70; border-radius: 14px">
<p id="l-src" style="margin: 0 0 8px; font-size: 16px; font-weight: 700; color: #EBD3A0">入口</p>
<div role="group" aria-labelledby="l-src" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{aSrcs}}" as="t" hint-placeholder-count="3">
<button type="button" class="tap" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="min-height: 48px; padding: 0 16px; border: 1px solid #D9B36A; border-radius: 999px; background: {{t.bg}}; color: {{t.fg}}; font-size: 15px; font-weight: 700">{{t.label}}</button>
</sc-for>
</div>
<label for="a-date" style="display: block; margin: 16px 0 6px; font-size: 16px; font-weight: 700; color: #EBD3A0">日にち<span style="margin-left: 8px; color: #FFC9BD; font-size: 14px">必須</span></label>
<input id="a-date" type="date" onChange="{{f.date}}" style="width: 100%; box-sizing: border-box; min-height: 52px; padding: 0 14px; border: 1px solid #8E7DB3; border-radius: 10px; background: #FFFFFF; color: #1B1030; color-scheme: light; font-size: 17px">
<p id="l-atime" style="margin: 16px 0 8px; font-size: 16px; font-weight: 700; color: #EBD3A0">始める時間</p>
<div role="group" aria-labelledby="l-atime" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{aTimes}}" as="t" hint-placeholder-count="5">
<button type="button" class="tap" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="min-width: 76px; min-height: 48px; padding: 0 14px; border: 1px solid #D9B36A; border-radius: 999px; background: {{t.bg}}; color: {{t.fg}}; font-size: 15px; font-weight: 700">{{t.label}}</button>
</sc-for>
</div>
<p id="l-alen" style="margin: 16px 0 8px; font-size: 16px; font-weight: 700; color: #EBD3A0">時間</p>
<div role="group" aria-labelledby="l-alen" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{aLens}}" as="t" hint-placeholder-count="2">
<button type="button" class="tap" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="min-width: 76px; min-height: 48px; padding: 0 14px; border: 1px solid #D9B36A; border-radius: 999px; background: {{t.bg}}; color: {{t.fg}}; font-size: 15px; font-weight: 700">{{t.label}}</button>
</sc-for>
</div>
<sc-if value="{{ferr.date}}" hint-placeholder-val="{{false}}"><p role="alert" style="margin: 8px 0 0; color: #FFC9BD; font-size: 15px; font-weight: 700">日にちをお選びください。</p></sc-if>
<sc-if value="{{ferr.dup}}" hint-placeholder-val="{{false}}"><p role="alert" style="margin: 8px 0 0; color: #FFC9BD; font-size: 15px; font-weight: 700">その日時には、もう予約が入っています。</p></sc-if>
</section>

<section style="padding: 22px 18px; background: #261744; border: 1px solid #4B3A70; border-radius: 14px">
<label for="a-name" style="display: block; margin: 0 0 6px; font-size: 16px; font-weight: 700; color: #EBD3A0">お名前<span style="margin-left: 8px; color: #FFC9BD; font-size: 14px">必須</span></label>
<input id="a-name" type="text" onChange="{{f.name}}" style="width: 100%; box-sizing: border-box; min-height: 52px; padding: 0 14px; border: 1px solid #8E7DB3; border-radius: 10px; background: #FFFFFF; color: #1B1030; font-size: 17px">
<label for="a-contact" style="display: block; margin: 14px 0 6px; font-size: 16px; font-weight: 700; color: #EBD3A0">ご連絡先（任意）</label>
<input id="a-contact" type="text" autocapitalize="off" placeholder="例：Instagramのユーザーネーム" onChange="{{f.contact}}" style="width: 100%; box-sizing: border-box; min-height: 52px; padding: 0 14px; border: 1px solid #8E7DB3; border-radius: 10px; background: #FFFFFF; color: #1B1030; font-size: 17px">
<label for="a-kinds" style="display: block; margin: 14px 0 6px; font-size: 16px; font-weight: 700; color: #EBD3A0">占い（任意）</label>
<input id="a-kinds" type="text" placeholder="例：タロット・数秘術" onChange="{{f.kinds}}" style="width: 100%; box-sizing: border-box; min-height: 52px; padding: 0 14px; border: 1px solid #8E7DB3; border-radius: 10px; background: #FFFFFF; color: #1B1030; font-size: 17px">
<label for="a-body" style="display: block; margin: 14px 0 6px; font-size: 16px; font-weight: 700; color: #EBD3A0">メモ（任意）</label>
<textarea id="a-body" rows="3" onChange="{{f.body}}" style="width: 100%; box-sizing: border-box; padding: 10px 14px; border: 1px solid #8E7DB3; border-radius: 10px; background: #FFFFFF; color: #1B1030; font-size: 17px; line-height: 1.7"></textarea>
<sc-if value="{{ferr.name}}" hint-placeholder-val="{{false}}"><p role="alert" style="margin: 8px 0 0; color: #FFC9BD; font-size: 15px; font-weight: 700">お名前をご入力ください。</p></sc-if>
</section>

<button type="button" class="tap btn-gold" onClick="{{go.save}}" style="min-height: 58px; border: 0; border-radius: 999px; background: #D9B36A; color: #1B1030; font-size: 18px; font-weight: 700; letter-spacing: .08em">台帳に足す</button>
<button type="button" onClick="{{go.list}}" style="min-height: 48px; border: 0; background: transparent; color: #F1ECFA; font-size: 16px; text-decoration: underline">やめて一覧に戻る</button>
</div>
</main>
</sc-if>

</div>
</template>
<script>
(function(){
var PROPS={};
function DCLogic(){this.props={};this.state={};}
DCLogic.prototype.setState=function(o){var p=typeof o==='function'?o(this.state):o;for(var k in p){this.state[k]=p[k];}render();};

window.DCLogic=DCLogic;
var WH=/^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/,HOLE=/\{\{\s*([^}]+?)\s*\}\}/g;
function lookup(path,sc){path=path.trim();if(path==='true')return true;if(path==='false')return false;if(/^-?\d+(\.\d+)?$/.test(path))return Number(path);var ps=path.split('.');for(var i=sc.length-1;i>=0;i--){if(sc[i]!=null&&ps[0] in sc[i]){var v=sc[i];for(var j=0;j<ps.length;j++){if(v==null)return undefined;v=v[ps[j]];}return v;}}return undefined;}
function interp(s,sc){return s.replace(HOLE,function(_,p){var v=lookup(p,sc);return v==null?'':String(v);});}
function kids(n,sc,parent){for(var c=n.firstChild;c;c=c.nextSibling)build(c,sc,parent);}
function listen(el,ev){if(!el.__l)el.__l={};if(el.__l[ev])return;el.__l[ev]=1;el.addEventListener(ev,function(e){var f=el.__h&&el.__h[ev];if(f)return f(e);});}
function build(n,sc,parent){
 if(n.nodeType===3){parent.appendChild(document.createTextNode(interp(n.nodeValue,sc)));return;}
 if(n.nodeType!==1)return;
 var tag=n.localName;
 if(tag==='sc-if'){var m0=WH.exec(n.getAttribute('value')||'');if(m0&&lookup(m0[1],sc))kids(n,sc,parent);return;}
 if(tag==='sc-for'){var m1=WH.exec(n.getAttribute('list')||'');var list=(m1&&lookup(m1[1],sc))||[];var as=n.getAttribute('as');list.forEach(function(it,i){var s={};s[as]=it;s.$index=i;kids(n,sc.concat([s]),parent);});return;}
 var el=document.createElementNS(n.namespaceURI,tag);el.__a={};el.__h={};
 for(var i=0;i<n.attributes.length;i++){var a=n.attributes[i],name=a.name,val=a.value;
  if(name.indexOf('hint-')===0)continue;
  var m=WH.exec(val);
  if(/^on[a-z]/i.test(name)){if(m){var fn=lookup(m[1],sc);if(typeof fn==='function'){var ev=name.slice(2).toLowerCase();if(ev==='change'&&(tag==='textarea'||(tag==='input'&&n.getAttribute('type')!=='checkbox')))ev='input';el.__h[ev]=fn;}}continue;}
  if(m){var v=lookup(m[1],sc);if(v===false||v==null)continue;el.__a[name]=v===true?'':String(v);continue;}
  el.__a[name]=interp(val,sc);}
 for(var k in el.__a)el.setAttribute(k,el.__a[k]);
 for(var e2 in el.__h)listen(el,e2);
 kids(n,sc,el);parent.appendChild(el);}
// 前の画面の要素を残したまま、変わった所だけを書きかえる（動きが途切れない・入力した内容が残る）
function sync(o,n){var oa=o.__a||{},na=n.__a||{},k;
 for(k in oa){if(!(k in na))o.removeAttribute(k);}
 for(k in na){if(oa[k]!==na[k])o.setAttribute(k,na[k]);}
 o.__a=na;o.__h=n.__h||{};for(k in o.__h)listen(o,k);}
function same(o,n){if(o.nodeType!==n.nodeType)return false;if(n.nodeType===3)return true;if(n.nodeType!==1)return false;return o.localName===n.localName&&o.namespaceURI===n.namespaceURI&&(o.id||'')===((n.__a&&n.__a.id)||'');}
