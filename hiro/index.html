<style>
body{margin:0;background:#1B1030}
a{color:#EBD3A0}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
:focus-visible{outline:3px solid #FFFFFF;outline-offset:2px}
h1,h2,h3,h4,dt,button{word-break:auto-phrase}
p,li,dd{text-wrap:pretty}
@media (max-width:759px){.pc-only{display:none !important}
.swipe{display:flex !important;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-inline:-16px !important;padding:6px 16px 16px !important;scroll-padding-inline:16px}
.swipe::-webkit-scrollbar{display:none}
.swipe>*{flex:0 0 78%;box-sizing:border-box;scroll-snap-align:start}}
@media (min-width:760px){.sp-only{display:none !important}}
@keyframes tw{0%,100%{opacity:.12;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.09)}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:120% 50%}to{background-position:-120% 50%}}
@keyframes glow{0%,100%{box-shadow:0 0 14px rgba(217,179,106,.35)}50%{box-shadow:0 0 34px rgba(217,179,106,.8)}}
@keyframes sweep{0%{transform:translateX(-140%) skewX(-20deg)}55%,100%{transform:translateX(380%) skewX(-20deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes aura{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.95;transform:scale(1.18)}}
@keyframes rise1{0%{transform:translate3d(0,0,0);opacity:0}8%{opacity:.9}85%{opacity:.5}100%{transform:translate3d(40px,-112vh,0);opacity:0}}
@keyframes rise2{0%{transform:translate3d(0,0,0);opacity:0}8%{opacity:.8}85%{opacity:.5}100%{transform:translate3d(-56px,-112vh,0);opacity:0}}
@keyframes rise3{0%{transform:translate3d(0,0,0);opacity:0}8%{opacity:.9}50%{transform:translate3d(34px,-56vh,0)}85%{opacity:.4}100%{transform:translate3d(-12px,-112vh,0);opacity:0}}
@keyframes shoot{0%{opacity:0;transform:translate3d(0,0,0) rotate(-28deg)}3%{opacity:1}14%{opacity:0;transform:translate3d(-460px,245px,0) rotate(-28deg)}100%{opacity:0;transform:translate3d(-460px,245px,0) rotate(-28deg)}}
@keyframes phase{0%,100%{opacity:.4}50%{opacity:1}}
.star{position:absolute;border-radius:50%;background:#FFF4D6;animation:tw 4s ease-in-out infinite;will-change:opacity,transform}
.dust{position:absolute;bottom:-12px;border-radius:50%;background:#EBD3A0;box-shadow:0 0 6px 1px rgba(235,211,160,.7);animation:rise1 18s linear infinite;will-change:transform,opacity}
.dust.b{animation-name:rise2}.dust.c{animation-name:rise3}
.shoot{position:absolute;width:130px;height:2px;border-radius:2px;background:linear-gradient(90deg,#FFFFFF,rgba(255,255,255,0));opacity:0;animation:shoot 9s linear infinite}
.kb{animation:kb 26s ease-in-out infinite alternate;will-change:transform}
.intro>*{animation:up 1.1s cubic-bezier(.2,.7,.2,1) both}
.intro>*:nth-child(2){animation-delay:.18s}.intro>*:nth-child(3){animation-delay:.36s}.intro>*:nth-child(4){animation-delay:.54s}.intro>*:nth-child(5){animation-delay:.72s}
.gold{background:linear-gradient(100deg,#D9B36A 0%,#D9B36A 38%,#FFF6DC 50%,#D9B36A 62%,#D9B36A 100%);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 6s linear infinite}
.btn-gold{position:relative;overflow:hidden;animation:glow 3.4s ease-in-out infinite;transition:transform .15s}
.btn-gold::after{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));animation:sweep 4.5s ease-in-out infinite;pointer-events:none}
.btn-gold:active,.tap:active{transform:scale(.97)}
.tap{transition:transform .15s,background-color .2s,color .2s}
.ring{animation:spin 90s linear infinite}
.fl{animation:float 5s ease-in-out infinite}
.aura{animation:aura 9s ease-in-out infinite}
.ph{animation:phase 4s ease-in-out infinite}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card{transition:border-color .4s,box-shadow .4s,transform .4s}
.card img{transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
@media (hover:hover){.card:hover{border-color:#D9B36A !important;box-shadow:0 0 28px rgba(217,179,106,.28);transform:translateY(-4px)}.card:hover img{transform:scale(1.07)}}
.fx .rv{opacity:0;transform:translateY(26px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
.fx .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}.fx .rv{opacity:1;transform:none}.shoot,.dust{display:none}}
</style>
<style>
:root{color-scheme:dark}
html{-webkit-text-size-adjust:100%;background:#1B1030}
@media (prefers-reduced-motion:no-preference){button{transition:background-color .15s,color .15s,border-color .15s}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div id="top" style="position: relative; background: #1B1030; color: #F1ECFA; font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif; font-weight: 400; font-size: 17px; line-height: 1.95; line-break: strict; overflow-x: hidden">

<div aria-hidden="true" style="position: fixed; inset: 0; z-index: 5; overflow: hidden; pointer-events: none">
<sc-for list="{{dust}}" as="d" hint-placeholder-count="0">
<span class="dust {{d.k}}" style="left: {{d.x}}; width: {{d.s}}; height: {{d.s}}; animation-duration: {{d.d}}; animation-delay: {{d.dl}}"></span>
</sc-for>
</div>

<sc-if value="{{is.stg}}" hint-placeholder-val="{{true}}">
<div style="background: #120A22; color: #EBD3A0; padding: 8px 16px; font-size: 14px; line-height: 1.6; text-align: center">公開前の確認用ページです。「確認待ち」と書いてある所は、仮の内容です。</div>
</sc-if>

<header style="position: relative; z-index: 6; background: #1B1030; border-bottom: 1px solid #4B3A70">
<div style="max-width: 1160px; margin: 0 auto; padding: 0 16px; min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<button type="button" onClick="{{go.home}}" aria-label="トップページへ" style="display: flex; align-items: center; gap: 12px; min-height: 48px; min-width: 0; padding: 0; border: 0; background: transparent; color: #F1ECFA; text-align: left">
<svg viewBox="0 0 44 44" aria-hidden="true" style="width: 42px; height: 42px; flex: 0 0 auto"><circle cx="22" cy="22" r="20.5" fill="none" stroke="#D9B36A" stroke-width="1"></circle><path d="M28 10a12.5 12.5 0 1 0 0 24a15 15 0 0 1 0-24z" fill="#D9B36A"></path><circle cx="30" cy="22" r="2.6" fill="#D9B36A"></circle><path d="M30 16.4v2M30 25.6v2M24.4 22h2M33.6 22h2M26 18l1.4 1.4M32.6 24.6L34 26M34 18l-1.4 1.4M27.4 24.6L26 26" stroke="#D9B36A" stroke-width="1" stroke-linecap="round"></path></svg>
<span style="display: flex; flex-direction: column; min-width: 0"><span class="gold" style="font-family: 'Cormorant Garamond', 'Shippori Mincho', serif; font-size: 26px; font-weight: 600; line-height: 1.2; letter-spacing: .22em; white-space: nowrap">HIRO</span><span style="font-size: 14px; line-height: 1.5; letter-spacing: .12em; color: #C9BDE3">ライトワーカー</span></span>
</button>
<nav class="pc-only" aria-label="主なメニュー" style="display: flex; align-items: center; gap: 2px">
<button type="button" class="tap" onClick="{{go.today}}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #F1ECFA; font-size: 15px">今日の1枚</button>
<button type="button" class="tap" onClick="{{go.menu}}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #F1ECFA; font-size: 15px">占いのご案内</button>
<button type="button" class="tap" onClick="{{go.care}}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #F1ECFA; font-size: 15px">大切にしていること</button>
<button type="button" class="tap" onClick="{{go.flow}}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #F1ECFA; font-size: 15px">鑑定の流れ</button>
<button type="button" class="tap" onClick="{{go.price}}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #F1ECFA; font-size: 15px">料金・鑑定日</button>
</nav>
<button type="button" class="pc-only btn-gold" onClick="{{go.reserve}}" style="min-height: 46px; padding: 0 26px; border: 0; border-radius: 999px; background: #D9B36A; color: #1B1030; font-size: 15px; font-weight: 700; letter-spacing: .08em">鑑定のご予約</button>
<button type="button" class="sp-only tap" onClick="{{go.toggle}}" aria-expanded="{{menuOpen}}" style="flex: 0 0 auto; min-width: 84px; min-height: 44px; border: 1px solid #D9B36A; border-radius: 999px; background: transparent; color: #EBD3A0; font-size: 14px; font-weight: 700">{{menuLabel}}</button>
</div>
<sc-if value="{{is.menu}}" hint-placeholder-val="{{false}}">
<nav class="sp-only" aria-label="メニュー" style="display: flex; flex-direction: column; border-top: 1px solid #4B3A70">
<button type="button" onClick="{{go.today}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #3A2A5C; background: #1B1030; color: #F1ECFA; font-size: 16px; text-align: left">今日の1枚</button>
<button type="button" onClick="{{go.menu}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #3A2A5C; background: #1B1030; color: #F1ECFA; font-size: 16px; text-align: left">占いのご案内</button>
<button type="button" onClick="{{go.care}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #3A2A5C; background: #1B1030; color: #F1ECFA; font-size: 16px; text-align: left">大切にしていること</button>
<button type="button" onClick="{{go.flow}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #3A2A5C; background: #1B1030; color: #F1ECFA; font-size: 16px; text-align: left">鑑定の流れ</button>
<button type="button" onClick="{{go.price}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #3A2A5C; background: #1B1030; color: #F1ECFA; font-size: 16px; text-align: left">料金・鑑定日</button>
<button type="button" onClick="{{go.profile}}" style="min-height: 54px; padding: 0 18px; border: 0; background: #1B1030; color: #F1ECFA; font-size: 16px; text-align: left">プロフィール</button>
</nav>
</sc-if>
</header>

<sc-if value="{{is.home}}" hint-placeholder-val="{{true}}">
<main>

<section style="position: relative; background: #1B1030; overflow: hidden">
<div class="sp-only" style="overflow: hidden">
<img class="kb" src="img/u_hero.jpg" alt="紫の夜空に金色の三日月と太陽。手前に水晶玉、アメジスト、灯したキャンドル、伏せたカード" style="display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: 78% 50%">
</div>
<img class="pc-only kb" src="img/u_hero.jpg" alt="紫の夜空に金色の三日月と太陽。手前に水晶玉、アメジスト、灯したキャンドル、伏せたカード" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% 50%">
<div class="pc-only" aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(90deg, #1B1030 0%, rgba(27, 16, 48, .88) 36%, rgba(27, 16, 48, 0) 68%)"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="0">
<span class="star" style="left: {{s.x}}; top: {{s.y}}; width: {{s.s}}; height: {{s.s}}; animation-duration: {{s.d}}; animation-delay: {{s.dl}}"></span>
</sc-for>
<span class="shoot" style="left: 72%; top: 6%; animation-delay: 2.5s"></span>
<span class="shoot" style="left: 96%; top: 22%; animation-duration: 13s; animation-delay: 7s"></span>
</div>
<div style="position: relative; max-width: 1160px; margin: 0 auto; padding: clamp(32px, 9vw, 116px) 16px clamp(40px, 9vw, 116px)">
<div class="intro" style="max-width: 600px; display: flex; flex-direction: column; align-items: flex-start; gap: 20px">
<p class="gold" style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: clamp(16px, 2.2vw, 20px); font-weight: 500; line-height: 1.4; letter-spacing: .2em">Tarot · Astrology · Numerology</p>
<h1 style="margin: 0; font-family: 'Shippori Mincho', 'Yu Mincho', serif; font-size: clamp(28px, 4.6vw, 48px); font-weight: 500; line-height: 1.55; letter-spacing: .06em; text-shadow: 0 0 24px rgba(160, 120, 240, .55)">あなたの今に、<br>静かに寄り添う鑑定を。</h1>
<p style="margin: 0; font-size: 17px; color: #E3DAF5">カードと、星と、数。いくつもの占いを重ねて、いまのあなたに必要なメッセージをお届けします。お電話での遠隔鑑定もできます。</p>
<p style="margin: 0; padding: 6px 18px; border: 1px solid #D9B36A; border-radius: 999px; font-size: 15px; line-height: 1.7; letter-spacing: .06em; color: #EBD3A0">完全予約制　平日 9:00〜15:00</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<button type="button" class="btn-gold" onClick="{{go.reserve}}" style="min-height: 56px; padding: 0 32px; border: 0; border-radius: 999px; background: #D9B36A; color: #1B1030; font-size: 17px; font-weight: 700; letter-spacing: .08em">鑑定を予約する</button>
<button type="button" class="tap" onClick="{{go.today}}" style="min-height: 56px; padding: 0 28px; border: 1px solid #C9BDE3; border-radius: 999px; background: rgba(27, 16, 48, .6); color: #F1ECFA; font-size: 17px; font-weight: 500">今日の1枚を引く</button>
</div>
</div>
</div>
</section>

<section aria-label="鑑定で大切にしていること" style="background: #261744; border-top: 1px solid #4B3A70; border-bottom: 1px solid #4B3A70">
<div style="max-width: 1160px; margin: 0 auto; padding: 20px 16px; display: flex; flex-wrap: wrap; justify-content: space-around; gap: 4px 28px">
<sc-for list="{{words}}" as="w" hint-placeholder-count="3">
<p style="margin: 0; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: 'Shippori Mincho', serif; font-size: 19px; font-weight: 500; letter-spacing: .14em; color: #EBD3A0"><svg class="ph" viewBox="0 0 20 20" aria-hidden="true" style="width: 16px; height: 16px; flex: 0 0 auto; animation-delay: {{w.dl}}"><path d="M10 0c.8 5.6 4.4 9.2 10 10c-5.6.8-9.2 4.400-10 10c-.8-5.6-4.400-9.200-10-10c5.600-.8 9.200-4.400 10-10z" fill="#D9B36A"></path></svg>{{w.t}}</p>
</sc-for>
</div>
</section>

<section id="today" style="position: relative; padding: 72px 0 68px; overflow: hidden">
<div class="aura" aria-hidden="true" style="position: absolute; left: 50%; top: 46%; width: 560px; height: 560px; margin: -280px 0 0 -280px; border-radius: 50%; background: radial-gradient(circle, rgba(150, 100, 235, .4) 0%, rgba(150, 100, 235, 0) 66%); pointer-events: none"></div>
<div class="rv" style="position: relative; max-width: 760px; margin: 0 auto; padding: 0 16px; text-align: center">
<p class="gold" style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 500; letter-spacing: .3em">Today's Card</p>
<h2 style="margin: 2px 0 6px; font-family: 'Shippori Mincho', 'Yu Mincho', serif; font-size: clamp(28px, 3.8vw, 38px); font-weight: 500; line-height: 1.5; letter-spacing: .1em">今日の1枚</h2>
<p style="margin: 0 0 30px; font-size: 16px; color: #E3DAF5">深呼吸をひとつ。直感で、1枚お選びください。</p>
<div style="display: flex; justify-content: center; gap: clamp(10px, 3.4vw, 30px)">
<sc-for list="{{draws}}" as="c" hint-placeholder-count="3">
<button type="button" class="{{c.cls}}" onClick="{{c.pick}}" aria-label="{{c.label}}" style="width: clamp(88px, 26vw, 168px); aspect-ratio: 5 / 8; padding: 0; border: 0; background: transparent; perspective: 900px; opacity: {{c.op}}; transition: opacity .6s; animation-delay: {{c.dl}}">
<span style="display: block; position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .95s cubic-bezier(.3, .8, .2, 1); transform: rotateY({{c.rot}})">
<span class="face" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border: 1px solid #D9B36A; border-radius: 12px; background: #2F1D54; box-shadow: 0 0 22px rgba(150, 100, 235, .45)">
<svg viewBox="0 0 60 96" aria-hidden="true" style="width: 100%; height: 100%"><rect x="5" y="5" width="50" height="86" rx="6" fill="none" stroke="#D9B36A" stroke-width=".8"></rect><path d="M34 34a13 13 0 1 0 0 26a17 17 0 0 1 0-26z" fill="#D9B36A"></path><path d="M41 44c.4 2.400 1.600 3.600 4 4c-2.400.4-3.600 1.600-4 4c-.4-2.400-1.600-3.600-4-4c2.400-.4 3.600-1.600 4-4zM30 14c.3 1.800 1.200 2.700 3 3c-1.800.3-2.700 1.200-3 3c-.3-1.800-1.200-2.700-3-3c1.800-.3 2.700-1.200 3-3zM30 76c.3 1.800 1.200 2.700 3 3c-1.800.3-2.700 1.200-3 3c-.3-1.800-1.200-2.700-3-3c1.800-.3 2.700-1.200 3-3z" fill="#EBD3A0"></path></svg>
</span>
<span class="face" style="position: absolute; inset: 0; transform: rotateY(180deg); box-sizing: border-box; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 2px solid #D9B36A; border-radius: 12px; background: #F6EEDC; color: #2A1846; box-shadow: 0 0 34px rgba(235, 211, 160, .7)">
<span style="font-family: 'Cormorant Garamond', serif; font-size: clamp(13px, 2.6vw, 17px); font-weight: 600; line-height: 1.3; letter-spacing: .12em; color: #7A5A1E">{{c.en}}</span>
<span style="font-family: 'Shippori Mincho', 'Yu Mincho', serif; font-size: clamp(24px, 6vw, 40px); font-weight: 700; line-height: 1.3; letter-spacing: .08em">{{c.name}}</span>
</span>
</span>
</button>
</sc-for>
</div>
<div aria-live="polite" style="min-height: 136px; margin-top: 26px">
<sc-if value="{{is.undrawn}}" hint-placeholder-val="{{true}}">
<p class="ph" style="margin: 0; padding-top: 8px; font-family: 'Shippori Mincho', 'Yu Mincho', serif; font-size: 18px; letter-spacing: .12em; color: #EBD3A0">カードに触れると、ひと言が現れます。</p>
</sc-if>
<sc-if value="{{is.drawn}}" hint-placeholder-val="{{false}}">
<div class="intro" style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<h3 style="margin: 0; font-family: 'Shippori Mincho', 'Yu Mincho', serif; font-size: 24px; font-weight: 500; letter-spacing: .12em; color: #EBD3A0">「{{drawn.name}}」のカード</h3>
<p style="margin: 0; max-width: 30em; font-size: 17px">{{drawn.msg}}</p>
<button type="button" class="tap" onClick="{{go.again}}" style="min-height: 48px; padding: 0 24px; border: 1px solid #C9BDE3; border-radius: 999px; background: transparent; color: #F1ECFA; font-size: 16px">もう一度引く</button>
</div>
</sc-if>
</div>
<p style="margin: 6px 0 0; font-size: 14px; color: #C9BDE3">お楽しみのひと言です。鑑定では、お話を伺ってから読み解きます。</p>
</div>
</section>

<section id="menu" style="background: #261744; padding: 80px 0 72px">
<div style="max-width: 1160px; margin: 0 auto; padding: 0 16px">
