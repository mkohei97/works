<style>
body{margin:0;background:#FFFFFF}
a{color:#1F5FAF}a:hover{color:#14215A}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
:focus-visible{outline:3px solid #E9A400;outline-offset:2px}
h1,h2,h3,dt,button{word-break:auto-phrase}
p,li,dd{text-wrap:pretty}
.min{font-family:'Shippori Mincho','Yu Mincho','Hiragino Mincho ProN',serif}
@media (max-width:759px){.pc-only{display:none !important}}
@media (min-width:760px){.sp-only{display:none !important}}
.hero{display:flex;flex-wrap:wrap;align-items:stretch;max-width:1200px;margin:0 auto}
.hero-text{flex:1 1 460px;min-width:0;box-sizing:border-box;padding:48px 16px 52px 24px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.hero-photo{flex:0 1 470px;min-width:0;position:relative;align-self:flex-end;box-sizing:border-box;padding:36px 12px 0}
.hero-photo img{position:relative;z-index:1;display:block;width:100%;height:auto}
.hero-photo::before{content:"";position:absolute;left:50%;top:44%;width:92%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.85),rgba(255,255,255,.35) 55%,rgba(255,255,255,0));pointer-events:none}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 40px}
.sec-photo{flex:0 1 380px;min-width:0}
.sec-photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px}
.cta-photo{flex:0 0 150px}
.cta-photo img{display:block;width:150px;height:150px;object-fit:cover;object-position:50% 22%;border-radius:50%;border:4px solid #FFFFFF}
@media (max-width:759px){.hero-photo{order:-1;flex:1 1 100%;max-width:310px;margin:0 auto;padding:18px 6px 0}.hero-text{padding:26px 16px 44px;background:#FFFFFF;border-top:4px solid #14215A}.sec-photo{flex:1 1 100%}.cta-photo{flex:0 0 110px}.cta-photo img{width:110px;height:110px}}
.pol{display:grid;grid-template-columns:1fr;gap:10px 40px;padding:28px 0;border-top:1px solid #D3DCE8}
@media (min-width:860px){.pol{grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr)}}
.msg{display:grid;grid-template-columns:1fr;gap:28px 64px}
@media (min-width:860px){.msg{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.intro>*{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.intro>*:nth-child(2){animation-delay:.08s}.intro>*:nth-child(3){animation-delay:.16s}.intro>*:nth-child(4){animation-delay:.24s}.intro>*:nth-child(5){animation-delay:.32s}
.mkr{background:linear-gradient(transparent 58%,#FFE38A 58%) no-repeat 0 0/100% 100%;font-weight:700}
.mkd{background:linear-gradient(transparent 62%,rgba(255,214,90,.45) 62%) no-repeat 0 0/100% 100%;color:#FFFFFF;font-weight:700}
.fx .rv .mkr,.fx .rv .mkd{background-size:0 100%;transition:background-size .9s cubic-bezier(.2,.7,.2,1) .35s}
.fx .rv.in .mkr,.fx .rv.in .mkd{background-size:100% 100%}
.tap{transition:transform .15s,background-color .15s,color .15s}.tap:active{transform:scale(.97)}
.ph img{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
@media (hover:hover){.ph:hover img{transform:scale(1.03)}}
.fx .rv{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.fx .rv.in{opacity:1;transform:none}
.stats>div{justify-content:flex-end}.stats>div:last-child{border-right:0 !important;margin-right:0 !important}
@media (max-width:759px){.stats{display:grid !important;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 !important}.stats>div{margin-right:0 !important;padding:0 10px !important}.stats>div:first-child{padding-left:0 !important}.stats dd{font-size:clamp(22px,6.6vw,28px) !important}}
/* 動き（上品に・控えめに） */
@keyframes kRise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes kFade{from{opacity:0}to{opacity:1}}
.hero-photo img{animation:kRise 1.2s cubic-bezier(.2,.7,.2,1) .2s both}
.hero-photo::before{animation:kFade 1.8s ease .5s both}
.eb::before{content:"";display:inline-block;vertical-align:middle;width:22px;height:2px;margin:0 10px 3px 0;background:#C8261E}
.fx .rv .eb::before,.fx .rv.eb::before{width:0;transition:width .7s cubic-bezier(.2,.7,.2,1) .15s}
.fx .rv.in .eb::before,.fx .rv.eb.in::before{width:22px}
.fx .rv h2>span{clip-path:inset(0 0 100% 0);transform:translateY(.4em);transition:clip-path .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.fx .rv h2>span:nth-child(2){transition-delay:.12s}.fx .rv h2>span:nth-child(3){transition-delay:.24s}
.fx .rv.in h2>span{clip-path:inset(-10% 0 -20% 0);transform:none}
.rimg,.ph{overflow:hidden}
.fx .rv .rimg img,.fx .rv.rimg img,.fx .rv .ph img{clip-path:inset(0 100% 0 0);transform:scale(1.08);transition:clip-path 1.1s cubic-bezier(.65,0,.35,1) var(--dl,0s),transform 1.8s cubic-bezier(.2,.7,.2,1) var(--dl,0s)}
.fx .rv.in .rimg img,.fx .rv.rimg.in img,.fx .rv.in .ph img{clip-path:inset(0);transform:none}
.qline{position:relative}
.qline::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#14215A;transform-origin:top}
.fx .rv.qline::before{transform:scaleY(0);transition:transform 1.1s cubic-bezier(.65,0,.35,1) .1s}
.fx .rv.qline.in::before{transform:none}
.fx .rv.qline>*{opacity:0;transform:translateY(10px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.fx .rv.qline>*:nth-child(1){transition-delay:.35s}.fx .rv.qline>*:nth-child(2){transition-delay:.55s}.fx .rv.qline>*:nth-child(3){transition-delay:.7s}.fx .rv.qline>*:nth-child(4){transition-delay:.85s}.fx .rv.qline>*:nth-child(n+5){transition-delay:1s}
.fx .rv.qline.in>*{opacity:1;transform:none}
.pol{position:relative;border-top:0 !important}
.pol::before{content:"";position:absolute;left:0;top:0;right:0;height:1px;background:#D3DCE8;transform-origin:left}
.dash{width:12px}
.fx .rv.pol{opacity:1;transform:none}
.fx .rv.pol::before{transform:scaleX(0);transition:transform 1.1s cubic-bezier(.65,0,.35,1)}
.fx .rv.pol.in::before{transform:none}
.fx .rv.pol .pn{opacity:0;transform:translateY(18px);transition:opacity .7s ease .1s,transform .8s cubic-bezier(.2,.7,.2,1) .1s}
.fx .rv.pol h3{opacity:0;transition:opacity .8s ease .22s}
.fx .rv.pol li{opacity:0;transform:translateX(-12px);transition:opacity .6s ease calc(.32s + var(--i,0)*.1s),transform .7s cubic-bezier(.2,.7,.2,1) calc(.32s + var(--i,0)*.1s)}
.fx .rv.pol .dash{width:0;transition:width .45s ease calc(.36s + var(--i,0)*.1s)}
.fx .rv.pol li .mkr{transition-delay:calc(.75s + var(--i,0)*.1s)}
.fx .rv.pol.in .pn,.fx .rv.pol.in h3,.fx .rv.pol.in li{opacity:1;transform:none}
.fx .rv.pol.in .dash{width:12px}
.band{position:relative}.band>*{position:relative;z-index:1}
.band::before{content:"";position:absolute;inset:0;background:#14215A;transform-origin:left}
.fx .rv.band{background:transparent !important;opacity:1;transform:none}
.fx .rv.band::before{transform:scaleX(0);transition:transform 1.2s cubic-bezier(.65,0,.35,1)}
.fx .rv.band.in::before{transform:none}
.fx .rv.band>*{opacity:0;transition:opacity .8s ease .7s}
.fx .rv.band.in>*{opacity:1}
.fx .rv .cta-photo img{opacity:0;transform:scale(.88);transition:opacity .9s ease .1s,transform 1.1s cubic-bezier(.2,.7,.2,1) .1s}
.fx .rv.in .cta-photo img{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.fx .rv h2>span,.fx .rv .rimg img,.fx .rv.rimg img,.fx .rv .ph img,.fx .rv.band>*,.fx .rv.qline>*,.fx .rv.pol .pn,.fx .rv.pol h3,.fx .rv.pol li,.fx .rv .cta-photo img{opacity:1;transform:none;clip-path:none}.fx .rv.qline::before,.fx .rv.pol::before,.fx .rv.band::before{transform:none}.fx .rv.pol .dash{width:12px}.fx .rv .eb::before,.fx .rv.eb::before{width:22px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}.fx .rv{opacity:1;transform:none}.fx .rv .mkr,.fx .rv .mkd{background-size:100% 100%}}
</style>
<style>
:root{color-scheme:light}
html{-webkit-text-size-adjust:100%;background:#FFFFFF}
@media (prefers-reduced-motion:no-preference){button{transition:background-color .15s,color .15s,border-color .15s}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div id="top" style="background: #FFFFFF; color: #1B2540; font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif; font-weight: 400; font-size: 17px; line-height: 1.9; line-break: strict; overflow-x: hidden">

<header style="position: relative; z-index: 5; background: #FFFFFF; border-bottom: 1px solid #DDE4EE">
<div style="max-width: 1200px; margin: 0 auto; padding: 0 16px; min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<button type="button" class="tap" onClick="{{go.home}}" aria-label="トップページへ" style="display: flex; align-items: center; gap: 12px; min-height: 48px; min-width: 0; padding: 0; border: 0; background: transparent; color: #14215A; text-align: left">
<span aria-hidden="true" style="flex: 0 0 auto; width: 6px; height: 40px; background: #14215A"></span>
<span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700; line-height: 1.4; letter-spacing: .08em; color: #4A5570">羽曳野市議会議員</span><span style="font-size: 25px; font-weight: 900; line-height: 1.25; letter-spacing: .06em; white-space: nowrap">黒川みのる</span></span>
</button>
<nav class="pc-only" aria-label="主なメニュー" style="display: flex; align-items: center; gap: 2px">
<button type="button" class="tap" onClick="{{go.message}}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #1B2540; font-size: 15px; font-weight: 700">ごあいさつ</button>
<button type="button" class="tap" onClick="{{go.policy}}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #1B2540; font-size: 15px; font-weight: 700">政策</button>
<button type="button" class="tap" onClick="{{go.activity}}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #1B2540; font-size: 15px; font-weight: 700">活動</button>
<button type="button" class="tap" onClick="{{go.profile}}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #1B2540; font-size: 15px; font-weight: 700">プロフィール</button>
<button type="button" class="tap" onClick="{{go.office}}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #1B2540; font-size: 15px; font-weight: 700">事務所</button>
</nav>
<div class="pc-only" style="display: flex; gap: 8px">
<a class="tap" href="https://line.me/ti/p/orHb3qUpZp" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; min-height: 46px; padding: 0 18px; border: 1px solid #14215A; border-radius: 4px; color: #14215A; font-size: 15px; font-weight: 700; text-decoration: none">LINEで相談</a>
<button type="button" class="tap" onClick="{{go.ask}}" style="min-height: 46px; padding: 0 20px; border: 0; border-radius: 4px; background: #14215A; color: #FFFFFF; font-size: 15px; font-weight: 700">ご意見・ご相談</button>
</div>
<button type="button" class="sp-only" onClick="{{go.toggle}}" aria-expanded="{{menuOpen}}" style="flex: 0 0 auto; min-width: 84px; min-height: 44px; border: 1px solid #14215A; border-radius: 4px; background: #FFFFFF; color: #14215A; font-size: 14px; font-weight: 700">{{menuLabel}}</button>
</div>
<sc-if value="{{is.menu}}" hint-placeholder-val="{{false}}">
<nav class="sp-only" aria-label="メニュー" style="display: flex; flex-direction: column; border-top: 1px solid #DDE4EE">
<button type="button" class="tap" onClick="{{go.message}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #EEF2F7; background: #FFFFFF; color: #1B2540; font-size: 16px; text-align: left">ごあいさつ</button>
<button type="button" class="tap" onClick="{{go.policy}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #EEF2F7; background: #FFFFFF; color: #1B2540; font-size: 16px; text-align: left">政策</button>
<button type="button" class="tap" onClick="{{go.activity}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #EEF2F7; background: #FFFFFF; color: #1B2540; font-size: 16px; text-align: left">地域での活動</button>
<button type="button" class="tap" onClick="{{go.profile}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #EEF2F7; background: #FFFFFF; color: #1B2540; font-size: 16px; text-align: left">プロフィール</button>
<button type="button" class="tap" onClick="{{go.office}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #EEF2F7; background: #FFFFFF; color: #1B2540; font-size: 16px; text-align: left">事務所のご案内</button>
<a href="https://line.me/ti/p/orHb3qUpZp" target="_blank" rel="noopener" style="display: flex; align-items: center; min-height: 54px; padding: 0 18px; background: #FFFFFF; color: #1F5FAF; font-size: 16px; font-weight: 700; text-decoration: none">LINEで相談する</a>
</nav>
</sc-if>
</header>

<sc-if value="{{is.home}}" hint-placeholder-val="{{true}}">
<main>

<section aria-label="はじめに" style="background: linear-gradient(100deg, #F1F8FE 0%, #DCEEFA 52%, #BFDCF1 100%)">
<div class="hero">
<div class="hero-text intro">
<p style="margin: 0; align-self: flex-start; padding: 2px 12px; background: #14215A; color: #FFFFFF; font-size: 15px; font-weight: 700; letter-spacing: .12em">羽曳野市議会議員</p>
<h1 style="margin: 0; display: flex; flex-direction: column; color: #14215A; line-height: 1.1"><span style="font-size: 16px; font-weight: 700; letter-spacing: .62em; color: #4A5570">くろかわ</span><span style="font-size: clamp(54px, 9vw, 104px); font-weight: 900; letter-spacing: .02em">黒川みのる</span></h1>
<p class="min" style="margin: 0; font-size: clamp(23px, 3.2vw, 32px); font-weight: 700; line-height: 1.6; color: #14215A"><span style="display: inline-block">みなさんと</span><span style="display: inline-block">一緒につくる</span><br><span style="color: #C8261E"><span style="display: inline-block">誰もが</span><span style="display: inline-block">住みたい</span><span style="display: inline-block">街づくりを。</span></span></p>
<dl class="stats" style="margin: 4px 0 0; display: flex; flex-wrap: wrap; gap: 14px 0">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
<div style="padding: 0 clamp(12px, 2.4vw, 22px) 0 0; margin-right: clamp(12px, 2.4vw, 22px); border-right: 1px solid #9FB6CF; display: flex; flex-direction: column-reverse">
<dt style="font-size: 14px; font-weight: 500; line-height: 1.5; color: #4A5570"><sc-for list="{{s.k}}" as="w" hint-placeholder-count="2"><span style="display: inline-block">{{w}}</span></sc-for></dt>
<dd style="margin: 0; font-size: 30px; font-weight: 900; line-height: 1.25; color: #14215A">{{s.n}}<span style="margin-left: 2px; font-size: 16px; font-weight: 700">{{s.u}}</span></dd>
</div>
</sc-for>
</dl>
<div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px">
<button type="button" class="tap" onClick="{{go.policy}}" style="min-height: 54px; padding: 0 30px; border: 0; border-radius: 4px; background: #14215A; color: #FFFFFF; font-size: 17px; font-weight: 700">政策を見る</button>
<button type="button" class="tap" onClick="{{go.ask}}" style="min-height: 54px; padding: 0 26px; border: 1px solid #14215A; border-radius: 4px; background: rgba(255, 255, 255, .7); color: #14215A; font-size: 17px; font-weight: 700">ご意見・ご相談</button>
</div>
</div>
<div class="hero-photo">
<img src="img/k_cut.webp" alt="黒川みのるの写真。紺のスーツに縞のネクタイで、ほほえんでいる">
</div>
</div>
</section>

<section id="message" style="padding: 84px 0 80px">
<div style="max-width: 820px; margin: 0 auto; padding: 0 16px">
<p class="rv eb" style="margin: 0 0 18px; font-size: 15px; font-weight: 700; letter-spacing: .14em; color: #C8261E">ごあいさつ</p>
<figure class="rv" style="margin: 0 0 36px"><div class="rimg" style="border-radius: 4px"><img src="img/k_msg.jpg" alt="羽曳野市議会の議場で、自分の席に座る黒川みのる" loading="lazy" decoding="async" style="display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover"></div><figcaption style="margin-top: 8px; font-size: 14px; color: #4A5570">羽曳野市議会の議場で</figcaption></figure>
<div class="rv qline" style="padding-left: clamp(18px, 3vw, 28px)">
<p class="min" style="margin: 0 0 32px; font-size: clamp(24px, 3.1vw, 34px); font-weight: 700; line-height: 1.6; color: #14215A"><span style="display: inline-block"><span style="display: inline-block">何にでも賛成する</span><span style="display: inline-block">議員ではなく、</span></span><span style="display: inline-block"><span style="display: inline-block">皆さんの声を、</span><span style="display: inline-block">市政に届ける</span><span style="display: inline-block">議員でありたい。</span></span></p>
<p style="margin: 0 0 18px">市議会議員として6期目となる今日まで、多くのご相談やご提言をいただいてきました。</p>
<p style="margin: 0 0 18px">その経験を生かし、<span class="mkr">少しでも皆さんのご意見を市政に反映できるよう</span>、必要な政策を提言し、訴えてまいります。</p>
<p style="margin: 0">羽曳野市の未来のために、進めたいことがたくさんあります。前向きに歩んでいく夢のある羽曳野市を、みなさんと一緒につくるため、全力を尽くします。</p>
<p style="margin: 28px 0 0; display: flex; align-items: baseline; justify-content: flex-end; gap: 14px"><span style="font-size: 15px; color: #4A5570">羽曳野市議会議員</span><span class="min" style="font-size: 28px; font-weight: 700; letter-spacing: .1em; color: #14215A">黒川みのる</span></p>
</div>
</div>
</section>

<section id="policy" style="background: #F3F6FA; padding: 80px 0 84px">
<div style="max-width: 1100px; margin: 0 auto; padding: 0 16px">
<div class="rv sec-head" style="margin-bottom: 28px">
<div style="flex: 1 1 360px; min-width: 0">
<p class="eb" style="margin: 0 0 6px; font-size: 15px; font-weight: 700; letter-spacing: .14em; color: #C8261E">政策</p>
<h2 style="margin: 0 0 12px; font-size: clamp(27px, 3.8vw, 40px); font-weight: 900; line-height: 1.45; color: #14215A"><span style="display: inline-block">羽曳野の</span><span style="display: inline-block">未来のために、</span><span style="display: inline-block">進めたいこと。</span></h2>
<p style="margin: 0; font-size: 16px">これまで議会で取り上げてきたことを土台に、6期目に進めたいことをまとめました。</p>
</div>
<div class="sec-photo rimg"><img src="img/k_pol.jpg" alt="議場の演壇に立つ黒川みのる" loading="lazy" decoding="async" style="object-position: 50% 30%"></div>
</div>
<sc-for list="{{policies}}" as="p" hint-placeholder-count="6">
<article class="rv pol">
<div style="display: flex; align-items: baseline; gap: 16px">
<span class="min pn" aria-hidden="true" style="flex: 0 0 auto; font-size: 40px; font-weight: 700; line-height: 1; color: #1F5FAF">{{p.n}}</span>
<h3 style="margin: 0; font-size: clamp(21px, 2.4vw, 25px); font-weight: 900; line-height: 1.5; color: #14215A"><sc-for list="{{p.kp}}" as="w" hint-placeholder-count="2"><span style="display: inline-block">{{w}}</span></sc-for></h3>
</div>
