<body>

<sc-if value="{{is.stg}}" hint-placeholder-val="{{true}}">

</sc-if>

<button type="button" class="tap" onClick="{{go.policy}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #E4ECF7; background: #FFFFFF; color: #1A2766; font-size: 16px; text-align: left">政策</button>

<sc-if value="{{is.home}}" hint-placeholder-val="{{true}}">
<main>

<section class="sky" style="background-image: linear-gradient(120deg, #E6F3FC 0%, #BFE0F7 45%, #E6F3FC 100%); padding: 40px 0 56px">
<div style="max-width: 1160px; margin: 0 auto; padding: 0 16px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 28px 44px; padding: 32px 28px; background: #FFFFFF; border-radius: 14px; border-top: 6px solid #1A2766; box-shadow: 0 8px 28px rgba(26, 39, 102, .08)">
<div class="intro" style="flex: 1.4 1 340px; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 14px">
<p style="margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .14em; color: #1259A8">羽曳野市議会議員</p>
<h1 style="margin: 0; display: flex; flex-direction: column; line-height: 1.2"><span style="font-size: 15px; font-weight: 700; letter-spacing: .5em; color: #44527A">くろかわ</span><span style="font-size: clamp(44px, 7.4vw, 76px); font-weight: 900; letter-spacing: .06em">黒川みのる</span></h1>
<p style="margin: 0; font-size: clamp(22px, 3.2vw, 30px); font-weight: 900; line-height: 1.6">みなさんと一緒につくる<br><span class="mk" style="color: #C2261D; background: linear-gradient(transparent 64%, #FCE38A 64%) no-repeat">誰もが住みたい街づくりを！</span></p>
<p style="margin: 0; max-width: 32em; font-size: 17px">前向きに歩んでいく、夢のある羽曳野市を。市民目線で、皆さまのご意見を議会に届けます。</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<button type="button" class="tap" onClick="{{go.policy}}" style="min-height: 54px; padding: 0 28px; border: 0; border-radius: 6px; background: #1259A8; color: #FFFFFF; font-size: 17px; font-weight: 700">政策を見る</button>
<button type="button" class="tap" onClick="{{go.ask}}" style="min-height: 54px; padding: 0 28px; border: 1px solid #1A2766; border-radius: 6px; background: #FFFFFF; color: #1A2766; font-size: 17px; font-weight: 700">ご意見・ご相談</button>
</div>
</div>
<div style="flex: 0 1 300px; min-width: 220px; margin-inline: auto">
<img src="img/k_face.jpg" alt="黒川みのるの写真。紺のスーツに縞のネクタイで、ほほえんでいる" style="display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 20%; border-radius: 12px; background: #BFE0F7">
<sc-if value="{{is.stg}}" hint-placeholder-val="{{true}}"><p style="margin: 10px 0 0; padding: 8px 12px; border: 1px dashed #1259A8; border-radius: 8px; font-size: 14px; line-height: 1.6; color: #1259A8">確認待ち：写真はチラシから切り出した仮のものです。元の写真データをいただければ差し替えます。</p></sc-if>
</div>
</div>
</div>
</section>

<section id="message" style="padding: 72px 0 64px">
<div class="rv" style="max-width: 820px; margin: 0 auto; padding: 0 16px">
<p style="margin: 0; color: #1259A8; font-size: 14px; font-weight: 700; letter-spacing: .16em">メッセージ</p>
<h2 style="margin: 4px 0 20px; font-size: clamp(26px, 3.6vw, 36px); font-weight: 900; line-height: 1.5">ごあいさつ</h2>
<p style="margin: 0 0 16px">市議会議員として5期18年の間、多くのご相談やご提言をいただいてきました。</p>
<p style="margin: 0 0 16px">その経験を生かし、何にでも賛成する議員ではなく、少しでも皆さんのご意見を市政に反映できるよう、必要な政策を提言し、訴えてまいります。</p>
<p style="margin: 0 0 24px">羽曳野市の未来のために、進めたいことがたくさんあります。前向きに歩んでいく夢のある羽曳野市を、みなさんと一緒につくるため、全力を尽くします。</p>
<p style="margin: 0; font-size: 18px; font-weight: 700; text-align: right">羽曳野市議会議員　黒川みのる</p>
<sc-if value="{{is.stg}}" hint-placeholder-val="{{true}}"><p style="margin: 18px 0 0; padding: 8px 14px; border: 1px dashed #1259A8; border-radius: 8px; font-size: 14px; line-height: 1.7; color: #1259A8">確認待ち：チラシの言葉をもとに、読みやすく整えました。言い回しのご希望があれば直します。</p></sc-if>
</div>
</section>

<section id="policy" style="background: #EEF5FC; padding: 68px 0 72px">

<p style="margin: 0; color: #1259A8; font-size: 14px; font-weight: 700; letter-spacing: .16em">政策</p>
<h2 style="margin: 4px 0 8px; font-size: clamp(26px, 3.6vw, 36px); font-weight: 900; line-height: 1.5">誰もが住みたくなる街づくり</h2>
<p style="margin: 0 0 28px; font-size: 17px">羽曳野市の未来のために、皆さんと一緒に進めたいことです。</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px">
<sc-for list="{{policies}}" as="p" hint-placeholder-count="6">
<article class="rv card" style="display: flex; flex-direction: column; gap: 10px; padding: 26px 24px; background: #FFFFFF; border-radius: 12px; border-top: 4px solid {{p.c}}; transition-delay: {{p.dl}}">
<p style="margin: 0; font-size: 34px; font-weight: 900; line-height: 1.2; color: #1259A8">{{p.n}}</p>
<h3 style="margin: 0; font-size: 22px; font-weight: 900; line-height: 1.5">{{p.k}}</h3>
<ul style="margin: 4px 0 0; padding: 12px 0 0; list-style: none; border-top: 1px solid #CFDDF0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{p.items}}" as="i" hint-placeholder-count="3">
<li style="display: flex; gap: 10px; font-size: 16px; line-height: 1.75"><span aria-hidden="true" style="flex: 0 0 auto; width: 10px; height: 10px; margin-top: 9px; border-radius: 50%; background: #F2B705"></span><span style="min-width: 0">{{i}}</span></li>
</sc-for>
</ul>
</article>
</sc-for>
</div>
<div class="rv" style="margin-top: 24px; padding: 26px 24px; background: #1A2766; color: #FFFFFF; border-radius: 12px">
<p style="margin: 0; font-size: 14px; font-weight: 700; letter-spacing: .16em; color: #CFE3F7">他にも</p>
<h3 style="margin: 4px 0 10px; font-size: 22px; font-weight: 900; line-height: 1.5">新庁舎の建て替えを見直します</h3>
<p style="margin: 0 0 10px; font-size: 16px; color: #E8F0FA">建て替えにかかる建設費と設計を見直し、耐震に強く、使いやすい新庁舎への建て替えを提案します。</p>
<p style="margin: 0; font-size: 16px; color: #E8F0FA">少子高齢化が進む中、地域のコミュニティセンターなどの公共施設をネットワークで結び、市民に近い、利用しやすい行政サービスを優先します。</p>
</div>
<sc-if value="{{is.stg}}" hint-placeholder-val="{{true}}"><p style="margin: 16px 0 0; padding: 8px 14px; border: 1px dashed #1259A8; border-radius: 8px; font-size: 14px; line-height: 1.7; color: #1259A8">確認待ち：2枚のチラシの政策を、6つにまとめました。くわしい数字（新庁舎の費用など）を載せるかどうか。</p></sc-if>
</div>
</section>

<section id="activity" style="padding: 72px 0 64px">

<div style="aspect-ratio: 4 / 3; box-sizing: border-box; padding: 16px; display: flex; align-items: center; justify-content: center; border: 1px dashed #5B6E96; border-radius: 12px; background: #EEF5FC; color: #3E4C70; font-size: 15px; line-height: 1.7; text-align: center">ここに<br>活動の写真が<br>入ります</div>
<h3 style="margin: 4px 0 0; font-size: 22px; font-weight: 900; line-height: 1.5">{{a.k}}</h3>
<p style="margin: 0; font-size: 16px">{{a.v}}</p>

</sc-for>
</div>
<sc-if value="{{is.stg}}" hint-placeholder-val="{{true}}"><p style="margin: 20px 0 0; padding: 8px 14px; border: 1px dashed #1259A8; border-radius: 8px; font-size: 14px; line-height: 1.7; color: #1259A8">確認待ち：活動の写真（チラシの写真は小さいため、元のデータをいただきたい。お子さんが写る写真は、顔が分からないものだけにします）。</p></sc-if>
</div>
</section>

<section id="sns" style="background: #EEF5FC; padding: 64px 0 60px">
<div class="rv" style="max-width: 1160px; margin: 0 auto; padding: 0 16px">
<p style="margin: 0; color: #1259A8; font-size: 14px; font-weight: 700; letter-spacing: .16em">SNS</p>
<h2 style="margin: 4px 0 8px; font-size: clamp(24px, 3.2vw, 30px); font-weight: 900; line-height: 1.5">日々の活動は、SNSでもお伝えしています。</h2>
<p style="margin: 0 0 20px; font-size: 16px">LINEでは、ご意見やご相談も受け付けています。</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<sc-for list="{{sns}}" as="s" hint-placeholder-count="3">
<a class="tap card" href="{{s.url}}" target="_blank" rel="noopener" style="display: flex; flex-direction: column; justify-content: center; min-height: 84px; box-sizing: border-box; padding: 14px 20px; background: #FFFFFF; border: 1px solid #CFDDF0; border-radius: 12px; color: #1A2766; text-decoration: none"><span style="font-size: 19px; font-weight: 900; line-height: 1.4">{{s.k}}</span><span style="font-size: 15px; color: #3E4C70">{{s.v}}</span></a>
</sc-for>
</div>
<sc-if value="{{is.stg}}" hint-placeholder-val="{{true}}"><p style="margin: 16px 0 0; padding: 8px 14px; border: 1px dashed #1259A8; border-radius: 8px; font-size: 14px; line-height: 1.7; color: #1259A8">確認待ち：Instagramのアドレス（チラシの表記「MINORU.H.N.S.R」から作りました）。</p></sc-if>
</div>
</section>

<section id="profile" style="padding: 68px 0 72px">
<div class="rv" style="max-width: 1000px; margin: 0 auto; padding: 0 16px">
<p style="margin: 0; color: #1259A8; font-size: 14px; font-weight: 700; letter-spacing: .16em">プロフィール</p>
<h2 style="margin: 4px 0 26px; font-size: clamp(26px, 3.6vw, 36px); font-weight: 900; line-height: 1.5">黒川みのる<span style="margin-left: 14px; font-size: 17px; font-weight: 500">くろかわ みのる</span></h2>
<dl style="margin: 0; padding: 6px 24px; background: #EEF5FC; border-radius: 12px">
<sc-for list="{{profile}}" as="s" hint-placeholder-count="6">
<div style="display: flex; flex-wrap: wrap; gap: 2px 20px; padding: 14px 0; border-bottom: 1px solid #CFDDF0">
<dt style="flex: 0 0 6em; font-size: 16px; font-weight: 700; color: #1259A8">{{s.k}}</dt>
<dd style="flex: 1 1 220px; min-width: 0; margin: 0; font-size: 16px">{{s.v}}</dd>
</div>
</sc-for>
</dl>
<p style="margin: 20px 0 0; font-size: 18px; font-weight: 700">私は市民目線で、皆さまのご意見を議会に訴えていきます。</p>
<sc-if value="{{is.stg}}" hint-placeholder-val="{{true}}"><p style="margin: 16px 0 0; padding: 8px 14px; border: 1px dashed #1259A8; border-radius: 8px; font-size: 14px; line-height: 1.7; color: #1259A8">確認待ち：学歴・お仕事の経歴・地域での役（自治会など）・趣味など、ほかに載せたいこと。</p></sc-if>
</div>
</section>

<section id="office" style="background: #EEF5FC; padding: 68px 0 72px">
<div class="rv" style="max-width: 1000px; margin: 0 auto; padding: 0 16px; display: flex; flex-wrap: wrap; gap: 28px 44px; align-items: center">
<div style="flex: 1 1 340px; min-width: 0">
<p style="margin: 0; color: #1259A8; font-size: 14px; font-weight: 700; letter-spacing: .16em">事務所のご案内</p>
<h2 style="margin: 4px 0 14px; font-size: clamp(24px, 3.2vw, 30px); font-weight: 900; line-height: 1.5">黒川みのる事務所</h2>
<p style="margin: 0 0 8px; font-size: 17px">羽曳野市羽曳が丘3-5-33</p>
<p style="margin: 0; display: flex; flex-wrap: wrap; gap: 0 18px; font-size: 17px"><a href="tel:0729588458" style="display: inline-flex; align-items: center; min-height: 44px; color: #1259A8; font-weight: 700">電話 072-958-8458</a><span style="display: inline-flex; align-items: center; min-height: 44px">FAX 072-958-8458</span></p>
<sc-if value="{{is.stg}}" hint-placeholder-val="{{true}}"><p style="margin: 10px 0 0; padding: 8px 14px; border: 1px dashed #1259A8; border-radius: 8px; font-size: 14px; line-height: 1.7; color: #1259A8">確認待ち：受付の時間、郵便番号、地図を載せるかどうか。</p></sc-if>
</div>
<div style="flex: 1 1 340px; min-width: 0; padding: 28px 24px; background: #1A2766; color: #FFFFFF; border-radius: 12px">
<h3 style="margin: 0 0 8px; font-size: 22px; font-weight: 900; line-height: 1.5">ご意見・ご相談をお寄せください。</h3>
<p style="margin: 0 0 18px; font-size: 16px; color: #E8F0FA">市政へのご意見や、地域の困りごとを、このページからお送りいただけます。</p>
<button type="button" class="tap" onClick="{{go.ask}}" style="width: 100%; min-height: 54px; border: 0; border-radius: 6px; background: #FFFFFF; color: #1A2766; font-size: 17px; font-weight: 700">ご意見・ご相談のフォームへ</button>
</div>
</div>
</section>

</main>
