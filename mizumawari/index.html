<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF">
<title>ゆのはな住器｜ホームページの見本</title>
<meta name="description" content="給湯・浴室・水まわりの工事の会社のホームページの見本です。会社名・費用は仮のものです。">
<meta property="og:type" content="website">
<meta property="og:title" content="ゆのはな住器｜ホームページの見本">
<meta property="og:description" content="給湯・浴室・水まわりの工事の会社のホームページの見本です。会社名・費用は仮のものです。">
<meta property="og:image" content="https://mkohei97.github.io/works/mizumawari/img/m_hero.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>body{margin:0}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#0B6470}a:hover{color:#17272B}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
:focus-visible{outline:3px solid #F0A040;outline-offset:2px}
h1,h2,h3,dt,button{word-break:auto-phrase}
p,li,dd{text-wrap:pretty}
@media (max-width:759px){.pc-only{display:none !important}
.m-first{order:-1}
.swipe{display:flex !important;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-inline:-16px !important;padding:4px 16px 14px !important;scroll-padding-inline:16px}
.swipe::-webkit-scrollbar{display:none}
.swipe>*{flex:0 0 80%;box-sizing:border-box;scroll-snap-align:start}}
@media (min-width:760px){.sp-only{display:none !important}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.kb{animation:kb 24s ease-in-out infinite alternate;will-change:transform}
.intro>*{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.intro>*:nth-child(2){animation-delay:.1s}.intro>*:nth-child(3){animation-delay:.2s}.intro>*:nth-child(4){animation-delay:.3s}
.tap{transition:transform .15s,background-color .15s,color .15s}.tap:active{transform:scale(.97)}
.card{transition:transform .3s,box-shadow .3s}
.card img{transition:transform .9s cubic-bezier(.2,.7,.2,1)}
@media (hover:hover){.card:hover{box-shadow:0 10px 24px rgba(23,39,43,.14)}.card:hover img{transform:scale(1.05)}}
.fx .rv{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.fx .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}.fx .rv{opacity:1;transform:none}}
</style>
<style>
:root{color-scheme:light}
html{-webkit-text-size-adjust:100%;background:#FFFFFF}
@media (prefers-reduced-motion:no-preference){button{transition:background-color .15s,color .15s,border-color .15s}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div id="top" style="background: #FFFFFF; color: #17272B; font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif; font-weight: 400; font-size: 17px; line-height: 1.9; line-break: strict; overflow-x: hidden">

<div style="background: #17272B; color: #FFFFFF; padding: 8px 16px; font-size: 14px; line-height: 1.6; text-align: center">見本のページです。会社名・施工事例・費用・住所・電話番号は、仮のものです。</div>

<header style="background: #FFFFFF; border-bottom: 1px solid #C6D8DB">
<div style="max-width: 1160px; margin: 0 auto; padding: 0 16px; min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<button type="button" class="tap" onClick="{{go.home}}" aria-label="トップページへ" style="display: flex; align-items: center; gap: 12px; min-height: 48px; min-width: 0; padding: 0; border: 0; background: transparent; color: #17272B; text-align: left">
<svg viewBox="0 0 44 44" aria-hidden="true" style="width: 42px; height: 42px; flex: 0 0 auto"><rect x="2" y="2" width="40" height="40" rx="10" fill="#0B6470"></rect><path d="M22 9c5 6.5 8.5 11 8.5 15.5a8.5 8.5 0 0 1-17 0C13.5 20 17 15.5 22 9z" fill="#FFFFFF"></path></svg>
<span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 13px; line-height: 1.4; letter-spacing: .1em; color: #45585C">給湯・浴室・水まわりの工事</span><span style="font-size: 21px; font-weight: 900; line-height: 1.3; letter-spacing: .04em; white-space: nowrap">ゆのはな住器</span></span>
</button>
<nav class="pc-only" aria-label="主なメニュー" style="display: flex; align-items: center; gap: 2px">
<button type="button" class="tap" onClick="{{go.works}}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #17272B; font-size: 15px; font-weight: 500">対応工事</button>
<button type="button" class="tap" onClick="{{go.cases}}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #17272B; font-size: 15px; font-weight: 500">施工事例</button>
<button type="button" class="tap" onClick="{{go.flow}}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #17272B; font-size: 15px; font-weight: 500">ご相談の流れ</button>
<button type="button" class="tap" onClick="{{go.company}}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #17272B; font-size: 15px; font-weight: 500">会社概要</button>
</nav>
<div class="pc-only" style="display: flex; align-items: center; gap: 16px">
<span style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1.3"><span style="font-size: 20px; font-weight: 700; letter-spacing: .04em">000-000-0000</span><span style="font-size: 13px; color: #45585C">受付 8:30〜18:00（日・祝日は休み）</span></span>
<button type="button" class="tap" onClick="{{go.ask}}" style="min-height: 46px; padding: 0 22px; border: 0; border-radius: 6px; background: #B84A0E; color: #FFFFFF; font-size: 15px; font-weight: 700">相談・見積</button>
</div>
<button type="button" class="sp-only tap" onClick="{{go.toggle}}" aria-expanded="{{menuOpen}}" style="flex: 0 0 auto; min-width: 84px; min-height: 44px; border: 1px solid #17272B; border-radius: 6px; background: #FFFFFF; color: #17272B; font-size: 14px; font-weight: 700">{{menuLabel}}</button>
</div>
<sc-if value="{{is.menu}}" hint-placeholder-val="{{false}}">
<nav class="sp-only" aria-label="メニュー" style="display: flex; flex-direction: column; border-top: 1px solid #C6D8DB">
<button type="button" onClick="{{go.call}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #DDE9EB; background: #FFFFFF; color: #17272B; font-size: 16px; text-align: left">お急ぎのとき</button>
<button type="button" onClick="{{go.works}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #DDE9EB; background: #FFFFFF; color: #17272B; font-size: 16px; text-align: left">対応工事</button>
<button type="button" onClick="{{go.cases}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #DDE9EB; background: #FFFFFF; color: #17272B; font-size: 16px; text-align: left">施工事例</button>
<button type="button" onClick="{{go.guide}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #DDE9EB; background: #FFFFFF; color: #17272B; font-size: 16px; text-align: left">給湯器の交換の目安</button>
<button type="button" onClick="{{go.flow}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #DDE9EB; background: #FFFFFF; color: #17272B; font-size: 16px; text-align: left">ご相談の流れ</button>
<button type="button" onClick="{{go.faq}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #DDE9EB; background: #FFFFFF; color: #17272B; font-size: 16px; text-align: left">よくあるご質問</button>
<button type="button" onClick="{{go.company}}" style="min-height: 54px; padding: 0 18px; border: 0; background: #FFFFFF; color: #17272B; font-size: 16px; text-align: left">会社概要</button>
</nav>
</sc-if>
</header>

<sc-if value="{{is.home}}" hint-placeholder-val="{{true}}">
<main>

<section style="background: #EDF5F6; display: flex; flex-wrap: wrap; align-items: stretch">
<div class="intro" style="flex: 1 1 400px; min-width: 0; box-sizing: border-box; padding: clamp(24px, 5vw, 60px) 20px clamp(28px, 5vw, 56px) max(20px, calc((100vw - 1160px) / 2 + 16px)); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 14px">
<p style="margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .1em; color: #0B6470">◯◯市の、給湯と水まわりの設備会社</p>
<h1 style="margin: 0; font-size: clamp(28px, 3.7vw, 42px); font-weight: 900; line-height: 1.45; letter-spacing: .02em">お湯が出ない、<br>水が漏れる。<br>まずお電話ください。</h1>
<p style="margin: 0; max-width: 31em; font-size: 17px">給湯器の交換から、浴室・キッチン・トイレ・洗面所の工事、水漏れやつまりの修理まで。地元の設備会社が伺います。</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<button type="button" class="tap" onClick="{{go.call}}" style="min-height: 54px; padding: 0 28px; border: 0; border-radius: 6px; background: #B84A0E; color: #FFFFFF; font-size: 17px; font-weight: 700">電話で相談する</button>
<button type="button" class="tap pc-only" onClick="{{go.ask}}" style="min-height: 54px; padding: 0 28px; border: 1px solid #17272B; border-radius: 6px; background: #FFFFFF; color: #17272B; font-size: 17px; font-weight: 700">フォームで相談・見積</button>
</div>
</div>
<div style="flex: 1.25 1 420px; min-width: 0; min-height: clamp(200px, 52vw, 320px); position: relative; overflow: hidden">
<img class="kb" src="img/m_hero.jpg" alt="白い洗面化粧台のある洗面所と、その奥の明るい浴室" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 55%">
</div>
</section>

<section aria-label="会社のこと" style="background: #0B6470; color: #FFFFFF">
<div style="max-width: 1160px; margin: 0 auto; padding: 18px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 28px">
<sc-for list="{{facts}}" as="f" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; line-height: 1.6"><span style="font-size: 14px; letter-spacing: .08em; color: #D3E8EA">{{f.k}}</span><span style="font-size: 18px; font-weight: 700">{{f.v}}</span></div>
</sc-for>
</div>
</section>

<section id="call" style="padding: 60px 0 56px">
<div class="rv" style="max-width: 1160px; margin: 0 auto; padding: 0 16px; display: flex; flex-wrap: wrap; gap: 24px 40px; align-items: stretch">
<div style="flex: 1.3 1 400px; min-width: 0">
<p style="margin: 0; color: #0B6470; font-size: 14px; font-weight: 700; letter-spacing: .14em">お急ぎのとき</p>
<h2 style="margin: 4px 0 6px; font-size: clamp(26px, 3.6vw, 34px); font-weight: 900; line-height: 1.5">お電話の前に、3つだけ</h2>
<p style="margin: 0 0 16px; font-size: 16px; color: #45585C">分かる範囲でかまいません。お伝えいただくと、部品や代わりの機器の手配が早くなります。</p>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{before}}" as="b" hint-placeholder-count="3">
<li style="display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; border: 1px solid #C6D8DB; border-radius: 10px">
<span aria-hidden="true" style="flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; background: #0B6470; color: #FFFFFF; font-size: 17px; font-weight: 700; line-height: 34px; text-align: center">{{b.n}}</span>
<div style="min-width: 0"><h3 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.6">{{b.k}}</h3><p style="margin: 2px 0 0; font-size: 16px; line-height: 1.8; color: #2A3B3F">{{b.v}}</p></div>
</li>
</sc-for>
</ol>
<p style="margin: 14px 0 0; font-size: 15px; color: #45585C">ガスのにおいがするときは、窓を開けて、すぐにご契約のガス会社へご連絡ください。</p>
</div>
<div style="flex: 1 1 320px; min-width: 0; box-sizing: border-box; padding: 28px 24px; background: #17272B; color: #FFFFFF; border-radius: 10px; display: flex; flex-direction: column; justify-content: center; gap: 6px">
<p style="margin: 0; font-size: 15px; letter-spacing: .08em; color: #D3E8EA">お電話でのご相談</p>
<p style="margin: 0; font-size: clamp(30px, 8vw, 40px); font-weight: 900; line-height: 1.3; letter-spacing: .04em; white-space: nowrap">000-000-0000</p>
<p style="margin: 0 0 12px; font-size: 16px; color: #DCE7E9">受付 8:30〜18:00（日・祝日は休み）</p>
<p style="margin: 0 0 14px; font-size: 15px; line-height: 1.8; color: #DCE7E9">スマートフォンでは、この番号を押すとそのまま電話がかかるようにします。</p>
<button type="button" class="tap" onClick="{{go.askUrgent}}" style="min-height: 54px; border: 0; border-radius: 6px; background: #FFFFFF; color: #17272B; font-size: 17px; font-weight: 700">フォームで相談する</button>
<p style="margin: 8px 0 0; font-size: 14px; line-height: 1.7; color: #DCE7E9">受付時間の外は、フォームからお送りください。翌営業日にご連絡します。</p>
</div>
</div>
</section>

<section id="works" style="background: #EDF5F6; padding: 64px 0 60px">
<div style="max-width: 1160px; margin: 0 auto; padding: 0 16px">
<div class="rv">
<p style="margin: 0; color: #0B6470; font-size: 14px; font-weight: 700; letter-spacing: .14em">対応工事</p>
<h2 style="margin: 4px 0 6px; font-size: clamp(26px, 3.6vw, 34px); font-weight: 900; line-height: 1.5">頼める工事</h2>
<p style="margin: 0 0 24px; font-size: 16px; color: #45585C">蛇口1つの交換から、浴室の入替えまで。ここに無い工事も、まずはご相談ください。</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
<sc-for list="{{works}}" as="w" hint-placeholder-count="6">
<article class="rv" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 22px 20px; background: #FFFFFF; border-radius: 10px; transition-delay: {{w.dl}}">
<h3 style="margin: 0; display: flex; align-items: center; gap: 12px; font-size: 21px; font-weight: 900; line-height: 1.5"><span aria-hidden="true" style="flex: 0 0 auto; width: 10px; height: 26px; border-radius: 3px; background: #0B6470"></span>{{w.k}}</h3>
<p style="margin: 0; flex: 1 1 auto; font-size: 16px; line-height: 1.8; color: #2A3B3F">{{w.v}}</p>
<button type="button" class="tap" onClick="{{w.ask}}" style="align-self: flex-start; min-height: 46px; padding: 0 18px; border: 1px solid #0B6470; border-radius: 6px; background: #FFFFFF; color: #0B6470; font-size: 15px; font-weight: 700">この工事を相談する</button>
</article>
</sc-for>
</div>
</div>
</section>

<section id="cases" style="padding: 64px 0 60px">
<div style="max-width: 1160px; margin: 0 auto; padding: 0 16px">
<div class="rv">
<p style="margin: 0; color: #0B6470; font-size: 14px; font-weight: 700; letter-spacing: .14em">施工事例</p>
<h2 style="margin: 4px 0 14px; font-size: clamp(26px, 3.6vw, 34px); font-weight: 900; line-height: 1.5">工期と費用の目安つきで、ご紹介します。</h2>
<div role="group" aria-label="施工事例の絞り込み" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button type="button" class="tap" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="min-height: 46px; padding: 0 18px; border: 1px solid #17272B; border-radius: 999px; background: {{t.bg}}; color: {{t.fg}}; font-size: 16px; font-weight: 700">{{t.label}}</button>
</sc-for>
</div>
<p class="sp-only" style="margin: 10px 0 0; font-size: 14px; color: #45585C">横に動かして、ほかの事例もご覧ください。</p>
</div>
<div class="swipe" style="margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px">
<sc-for list="{{cases}}" as="c" hint-placeholder-count="6">
<article class="card" style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #C6D8DB; border-radius: 10px; overflow: hidden">
<div style="overflow: hidden"><img src="{{c.img}}" alt="{{c.alt}}" loading="lazy" decoding="async" style="display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover"></div>
<div style="display: flex; flex-direction: column; gap: 8px; flex: 1 1 auto; padding: 18px 20px 20px">
<p style="margin: 0; align-self: flex-start; padding: 0 12px; border-radius: 999px; background: #DFEEF0; color: #0B6470; font-size: 14px; font-weight: 700; line-height: 1.9">{{c.cat}}</p>
<h3 style="margin: 0; font-size: 19px; font-weight: 700; line-height: 1.6">{{c.title}}</h3>
<p style="margin: 0; flex: 1 1 auto; font-size: 16px; line-height: 1.8; color: #2A3B3F">{{c.body}}</p>
<dl style="margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
<div style="padding: 8px 12px; background: #EDF5F6; border-radius: 6px; line-height: 1.5"><dt style="font-size: 14px; color: #45585C">工期</dt><dd style="margin: 0; font-size: 18px; font-weight: 700">{{c.term}}</dd></div>
<div style="padding: 8px 12px; background: #EDF5F6; border-radius: 6px; line-height: 1.5"><dt style="font-size: 14px; color: #45585C">費用の目安（税込）</dt><dd style="margin: 0; font-size: 18px; font-weight: 700">{{c.cost}}</dd></div>
</dl>
<button type="button" class="tap" onClick="{{c.ask}}" style="min-height: 46px; border: 1px solid #0B6470; border-radius: 6px; background: #FFFFFF; color: #0B6470; font-size: 15px; font-weight: 700">同じような工事を相談する</button>
</div>
</article>
</sc-for>
</div>
<p style="margin: 14px 0 0; font-size: 15px; color: #45585C">費用は、機器代と工事費を含む目安です。機種や現場の条件によって、費用と工期は変わります。</p>
</div>
</section>

<section id="guide" style="background: #EDF5F6; padding: 60px 0 56px">
<div class="rv" style="max-width: 1000px; margin: 0 auto; padding: 0 16px; display: flex; flex-wrap: wrap; gap: 24px 44px; align-items: center">
<div style="flex: 0 1 280px; min-width: 0; box-sizing: border-box; padding: 26px 22px; background: #FFFFFF; border-radius: 10px; border-top: 6px solid #0B6470; text-align: center">
<p style="margin: 0; font-size: 15px; font-weight: 700; color: #45585C">家庭用の給湯器の、<br>設計上の標準使用期間</p>
<p style="margin: 4px 0 0; font-size: 64px; font-weight: 900; line-height: 1.2; color: #0B6470">10<span style="font-size: 26px; margin-left: 4px">年</span></p>
<p style="margin: 6px 0 0; font-size: 14px; line-height: 1.7; color: #45585C">多くのメーカーが、取扱説明書などに示している期間です。機種によって異なります。</p>
</div>
<div style="flex: 1.4 1 380px; min-width: 0">
<p style="margin: 0; color: #0B6470; font-size: 14px; font-weight: 700; letter-spacing: .14em">給湯器の交換の目安</p>
<h2 style="margin: 4px 0 12px; font-size: clamp(24px, 3.2vw, 30px); font-weight: 900; line-height: 1.5">こんな様子が出たら、止まる前にご相談ください。</h2>
<ul style="margin: 0 0 14px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{signs}}" as="s" hint-placeholder-count="4">
<li style="display: flex; gap: 10px; align-items: flex-start; font-size: 16px; line-height: 1.8"><span aria-hidden="true" style="flex: 0 0 auto; margin-top: 11px; width: 8px; height: 8px; border-radius: 50%; background: #0B6470"></span><span style="min-width: 0">{{s.t}}</span></li>
</sc-for>
</ul>
<p style="margin: 0 0 14px; font-size: 16px">急に止まると、機器が届くまでお湯が使えない日が出ます。早めにご相談いただくと、機種と費用を比べて選べます。高効率の給湯器への交換は、国や自治体の補助金の対象になる場合があります。対象になるかどうかも、当社で確かめます。</p>
<button type="button" class="tap" onClick="{{go.askHeater}}" style="min-height: 48px; padding: 0 20px; border: 1px solid #0B6470; border-radius: 6px; background: #FFFFFF; color: #0B6470; font-size: 16px; font-weight: 700">給湯器の交換を相談する</button>
</div>
</div>
</section>

<section id="flow" style="padding: 64px 0 60px">
<div class="rv" style="max-width: 1160px; margin: 0 auto; padding: 0 16px">
<p style="margin: 0; color: #0B6470; font-size: 14px; font-weight: 700; letter-spacing: .14em">ご相談の流れ</p>
