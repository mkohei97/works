<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="クリニックの採用サイトの見本です。院名は架空で、応募フォームは送信されません。">
<style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>クリニックの採用サイトの見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=Noto+Serif+JP:wght@600;700&amp;family=Zen+Maru+Gothic:wght@500;700&amp;family=Roboto:wght@400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#007C36}a:hover{color:#00632B}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
summary{cursor:pointer}
:focus-visible{outline:3px solid #E39A2D;outline-offset:2px}
@media (max-width:699px){.pc-only{display:none !important}}
@media (min-width:700px){.sp-only{display:none !important}}
</style>
<style>
:root{color-scheme:light}
html{-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:no-preference){button{transition:background-color .15s,color .15s,border-color .15s}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="background: #FFFFFF; color: #444444; font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, 'Noto Sans JP', sans-serif; font-size: 16px; line-height: 1.6; line-break: strict; overflow-x: hidden">

<div style="background: #444444; color: #FFFFFF">
<div style="max-width: 950px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px">
<div role="group" aria-label="表示の切り替え" style="display: flex; max-width: 480px; margin: 0 auto; border: 1px solid #FFFFFF; border-radius: 3px; overflow: hidden">
<button type="button" onClick="{{go.showSame}}" aria-pressed="{{tab.same.pressed}}" style="flex: 1 1 0; min-width: 0; min-height: 44px; padding: 0 4px; border: 0; background: {{tab.same.bg}}; color: {{tab.same.fg}}; font-size: 14px; font-weight: {{tab.same.fw}}; white-space: nowrap">現行の意匠</button>
<button type="button" onClick="{{go.showBetter}}" aria-pressed="{{tab.better.pressed}}" style="flex: 1 1 0; min-width: 0; min-height: 44px; padding: 0 4px; border: 0; border-left: 1px solid #FFFFFF; background: {{tab.better.bg}}; color: {{tab.better.fg}}; font-size: 14px; font-weight: {{tab.better.fw}}; white-space: nowrap">提案する意匠</button>
<button type="button" onClick="{{go.points}}" aria-pressed="{{tab.points.pressed}}" style="flex: 1 1 0; min-width: 0; min-height: 44px; padding: 0 4px; border: 0; border-left: 1px solid #FFFFFF; background: {{tab.points.bg}}; color: {{tab.points.fg}}; font-size: 14px; font-weight: {{tab.points.fw}}; white-space: nowrap">提案ポイント</button>
</div>
</div>
</div>

<div class="{{hdrCls}}" style="background: #FFFFFF">
<div style="max-width: 950px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 26px; display: flex; justify-content: center">
<button type="button" onClick="{{go.home}}" aria-label="採用情報のトップへ" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 18px; padding: 0; border: 0; background: transparent; color: #444444">
<svg aria-hidden="true" width="84" height="84" viewBox="0 0 52 52" fill="none"><circle cx="26" cy="26" r="25" stroke="#007C36" stroke-width="1.2"></circle><path d="M12 24c4-4 8-4 12 0s8 4 12 0c2-2 3-2.4 4-2.6" stroke="#007C36" stroke-width="2.2" stroke-linecap="round"></path><path d="M12 32c4-4 8-4 12 0s8 4 12 0c2-2 3-2.4 4-2.6" stroke="#8FC31F" stroke-width="2.2" stroke-linecap="round"></path></svg>
<span style="display: flex; flex-direction: column; align-items: center; gap: 8px"><span style="font-family: 'Yu Mincho', '游明朝', 'Hiragino Mincho ProN', 'Noto Serif JP', serif; font-size: clamp(22px, 4.6vw, 38px); font-weight: 700; line-height: 1.25; letter-spacing: .08em; color: #007C36">あさなぎ皮フ科クリニック</span><span style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px"><span style="padding: 0 16px; border-radius: 999px; background: #37821E; color: #FFFFFF; font-size: 13px; line-height: 1.7; letter-spacing: .3em">皮フ科</span><span style="padding: 0 16px; border-radius: 999px; background: #37821E; color: #FFFFFF; font-size: 13px; line-height: 1.7; letter-spacing: .3em">形成外科</span><span style="padding: 0 16px; border-radius: 999px; background: #37821E; color: #FFFFFF; font-size: 13px; line-height: 1.7; letter-spacing: .3em">採用情報</span></span></span>
</button>
</div>
<div>
<div style="max-width: 970px; margin: 0 auto; padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px)); padding-block: 0 13px; display: flex; flex-wrap: wrap; justify-content: center">
<button type="button" onClick="{{go.home}}" style="flex: 1 1 118px; max-width: 170px; min-height: 63px; padding: 8px 2px 5px; border: 0; border-left: 1px dotted #A89C90; background: transparent; color: #614D3F; font-size: 15px; line-height: 1.4">ホーム</button>
<button type="button" onClick="{{go.jobs}}" style="flex: 1 1 118px; max-width: 170px; min-height: 63px; padding: 8px 2px 5px; border: 0; border-left: 1px dotted #A89C90; background: transparent; color: #614D3F; font-size: 15px; line-height: 1.4">募集職種</button>
<button type="button" onClick="{{go.places}}" style="flex: 1 1 118px; max-width: 170px; min-height: 63px; padding: 8px 2px 5px; border: 0; border-left: 1px dotted #A89C90; background: transparent; color: #614D3F; font-size: 15px; line-height: 1.4">勤務地のご案内</button>
<button type="button" onClick="{{go.env}}" style="flex: 1 1 118px; max-width: 170px; min-height: 63px; padding: 8px 2px 5px; border: 0; border-left: 1px dotted #A89C90; background: transparent; color: #614D3F; font-size: 15px; line-height: 1.4">働く環境</button>
<button type="button" onClick="{{go.faq}}" style="flex: 1 1 118px; max-width: 170px; min-height: 63px; padding: 8px 2px 5px; border: 0; border-left: 1px dotted #A89C90; background: transparent; color: #614D3F; font-size: 15px; line-height: 1.4">よくある質問</button>
<button type="button" onClick="{{go.apply}}" style="flex: 1 1 118px; max-width: 170px; min-height: 63px; padding: 8px 2px 5px; border: 0; border-left: 1px dotted #A89C90; border-right: 1px dotted #A89C90; background: transparent; color: #614D3F; font-size: 15px; line-height: 1.4">ご応募フォーム</button>
</div>
</div>
</div>
<sc-if value="{{is.better}}" hint-placeholder-val="{{false}}">
<div class="sp-only" style="background: #FFFFFF; border-bottom: 1px solid #E6E6E6">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px))">
<button type="button" onClick="{{go.home}}" aria-label="採用情報のトップへ" style="display: flex; align-items: center; gap: 10px; min-height: 48px; min-width: 0; padding: 0; border: 0; background: transparent; text-align: left">
<svg aria-hidden="true" width="40" height="40" viewBox="0 0 52 52" fill="none" style="flex: 0 0 40px"><circle cx="26" cy="26" r="25" stroke="#007C36" stroke-width="1.2"></circle><path d="M12 24c4-4 8-4 12 0s8 4 12 0c2-2 3-2.4 4-2.6" stroke="#007C36" stroke-width="2.2" stroke-linecap="round"></path><path d="M12 32c4-4 8-4 12 0s8 4 12 0c2-2 3-2.4 4-2.6" stroke="#8FC31F" stroke-width="2.2" stroke-linecap="round"></path></svg>
<span style="display: flex; flex-direction: column; min-width: 0"><span style="font-family: 'Yu Mincho', '游明朝', 'Hiragino Mincho ProN', 'Noto Serif JP', serif; font-size: clamp(15px, 4.6vw, 19px); font-weight: 700; line-height: 1.3; letter-spacing: .04em; color: #007C36">あさなぎ皮フ科クリニック</span><span style="font-size: 12px; line-height: 1.4; color: #614D3F">採用情報</span></span>
</button>
<button type="button" onClick="{{go.menu}}" aria-expanded="{{menuOpen}}" style="flex: 0 0 auto; min-width: 72px; min-height: 48px; border: 1px solid #007C36; border-radius: 3px; background: #FFFFFF; color: #007C36; font-size: 13px; font-weight: 700">{{menuLabel}}</button>
</div>
<div style="display: {{menuD}}; flex-wrap: wrap; border-top: 1px solid #E6E6E6">
<button type="button" onClick="{{go.home}}" style="flex: 1 1 50%; box-sizing: border-box; min-height: 50px; padding: 0 8px; border: 0; border-bottom: 1px dotted #A89C90; background: transparent; color: #614D3F; font-size: 15px">ホーム</button><button type="button" onClick="{{go.jobs}}" style="flex: 1 1 50%; box-sizing: border-box; min-height: 50px; padding: 0 8px; border: 0; border-bottom: 1px dotted #A89C90; background: transparent; color: #614D3F; font-size: 15px">募集職種</button><button type="button" onClick="{{go.places}}" style="flex: 1 1 50%; box-sizing: border-box; min-height: 50px; padding: 0 8px; border: 0; border-bottom: 1px dotted #A89C90; background: transparent; color: #614D3F; font-size: 15px">勤務地のご案内</button><button type="button" onClick="{{go.env}}" style="flex: 1 1 50%; box-sizing: border-box; min-height: 50px; padding: 0 8px; border: 0; border-bottom: 1px dotted #A89C90; background: transparent; color: #614D3F; font-size: 15px">働く環境</button><button type="button" onClick="{{go.faq}}" style="flex: 1 1 50%; box-sizing: border-box; min-height: 50px; padding: 0 8px; border: 0; border-bottom: 1px dotted #A89C90; background: transparent; color: #614D3F; font-size: 15px">よくある質問</button><button type="button" onClick="{{go.apply}}" style="flex: 1 1 50%; box-sizing: border-box; min-height: 50px; padding: 0 8px; border: 0; border-bottom: 1px dotted #A89C90; background: transparent; color: #614D3F; font-size: 15px">ご応募フォーム</button>
</div>
</div>
</sc-if>

<sc-if value="{{is.sub}}" hint-placeholder-val="{{false}}">
<div>
<div style="background: rgba(93, 163, 77, .2); border-bottom: 1px solid #E5E5E5; box-shadow: inset 0 1px 5px rgba(0, 0, 0, .2); padding: 10px 16px">
<h1 style="margin: 25px 0 21px; font-family: 'Hiragino Maru Gothic ProN', 'ヒラギノ丸ゴ ProN W4', 'Zen Maru Gothic', sans-serif; font-size: 26px; font-weight: 500; line-height: 1.1; text-align: center; color: #444444">{{page.title}}</h1>
</div>
<div style="max-width: 950px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; align-items: center; gap: 0 6px; font-size: {{c.fsCrumb}}; color: #777777">
<button type="button" onClick="{{go.home}}" style="min-height: {{c.hCrumb}}; padding: 0; border: 0; background: transparent; color: #007C36; font-size: {{c.fsCrumb}}">ホーム</button><span>»</span><span>{{page.crumb}}</span>
</div>
</div>
</sc-if>

<sc-if value="{{is.home}}" hint-placeholder-val="{{true}}">
<div>

<div style="position: relative; overflow: hidden; background: #26241F">
<img src="img/room.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .22">
<div style="position: relative; max-width: 1024px; box-sizing: border-box; margin: 0 auto; padding: 50px max(30px, env(safe-area-inset-right, 0px)) 50px max(30px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 36px 0">
<div style="flex: 1 1 320px; max-width: 530px; min-width: 0; box-sizing: border-box; padding-right: 14px; padding-bottom: 14px">
<img src="img/reception.jpg" alt="白いカウンターと待合の椅子が並ぶ、明るい受付" style="display: block; box-sizing: border-box; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border: 1px solid rgba(255, 255, 255, .32); border-radius: 4px; box-shadow: 14px 14px 0 #007C36">
<p style="margin: 25px 0 0; padding: 10px 5px; background: rgba(255, 255, 255, .82); border-radius: 4px; text-align: center; font-size: 20px; font-weight: 700; line-height: 1.05; letter-spacing: .02em; color: {{c.or}}">看護師・受付スタッフ 募集中!!</p>
</div>
<div style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; color: #FFFFFF">
<p style="margin: 0 0 36px; font-family: 'Yu Mincho', '游明朝', 'Hiragino Mincho ProN', 'Noto Serif JP', serif; font-size: 20px; font-weight: 400; line-height: 1.4; word-break: keep-all; overflow-wrap: anywhere">通いやすい院で、<wbr>長く続けられる仕事を…</p>
<div style="width: min(100%, 291px); padding: 20px 0; border-top: 1px dashed #FFFFFF; border-bottom: 1px dashed #FFFFFF">
<p style="margin: 0; font-size: 14px; line-height: 1.6">関西・東海・関東<br>全{{stats.clinics}}院で募集中</p>
</div>
<sc-if value="{{is.better}}" hint-placeholder-val="{{false}}">
<div style="margin-top: 24px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center">
<button type="button" onClick="{{go.jobs}}" style="box-sizing: border-box; min-width: 190px; min-height: 50px; padding: 0 18px; border: 1px solid #007C36; border-radius: 3px; background: #007C36; color: #FFFFFF; font-size: 16px; font-weight: 700">募集職種を見る</button>
<button type="button" onClick="{{go.places}}" style="box-sizing: border-box; min-width: 190px; min-height: 50px; padding: 0 18px; border: 1px solid #007C36; border-radius: 3px; background: #FFFFFF; color: #007C36; font-size: 16px; font-weight: 700">勤務地から探す</button>
</div>
</sc-if>
</div>
</div>
</div>

<div style="background-color: #FAF7F4; background-image: repeating-linear-gradient(45deg, rgba(170, 150, 120, .07) 0 1px, transparent 1px 7px), repeating-linear-gradient(-45deg, rgba(170, 150, 120, .07) 0 1px, transparent 1px 7px)">
<div style="max-width: 950px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 33px 40px">
<h2 style="margin: 0; font-family: 'Yu Mincho', '游明朝', 'Hiragino Mincho ProN', 'Noto Serif JP', serif; font-size: 25.6px; font-weight: 700; line-height: 1.6; text-align: center">お知らせ</h2><span aria-hidden="true" style="display: block; width: 40px; height: 1px; margin: 10px auto 0; background: #37821E"></span>
<div style="margin-top: 20px; background: #FFFFFF; border: 1px solid #37821E; border-radius: 10px; padding: clamp(16px, 4vw, 40px)">
<div style="display: flex; flex-wrap: wrap; gap: 2px 16px; padding: 12px 0; border-bottom: 1px solid #E6E6E6; font-size: 16px; line-height: 1.4"><span style="flex: 0 0 140px; font-family: Roboto, 'Noto Sans JP', sans-serif; font-size: 15px; letter-spacing: 1.5px">2026年11月15日</span><span style="flex: 1 1 260px; min-width: 0; color: #333333; letter-spacing: .8px">看護師・受付スタッフの募集要項を更新いたしました</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 2px 16px; padding: 12px 0; border-bottom: 1px solid #E6E6E6; font-size: 16px; line-height: 1.4"><span style="flex: 0 0 140px; font-family: Roboto, 'Noto Sans JP', sans-serif; font-size: 15px; letter-spacing: 1.5px">2026年11月1日</span><span style="flex: 1 1 260px; min-width: 0; color: #333333; letter-spacing: .8px">採用情報のページを公開いたしました</span></div>
</div>
</div>
</div>

<div id="jobs" style="max-width: 950px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 44px 20px">
<h2 style="margin: 0; font-family: 'Yu Mincho', '游明朝', 'Hiragino Mincho ProN', 'Noto Serif JP', serif; font-size: 25.6px; font-weight: 700; line-height: 1.6; text-align: center">現在募集中の職種</h2><span aria-hidden="true" style="display: block; width: 40px; height: 1px; margin: 10px auto 0; background: #37821E"></span>
<p style="margin: 20px 0 0; text-align: center; font-size: 20px; font-weight: 700; line-height: 1.4; color: {{c.co}}">当法人では、看護師・准看護師、受付スタッフの募集を行っております。<br>ご一緒に働きませんか？</p>
<div style="margin-top: 24px; display: flex; flex-wrap: wrap; gap: 20px">
<sc-for list="{{jobs}}" as="j" hint-placeholder-count="2">
<div style="box-sizing: border-box; flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 24px clamp(16px, 4vw, 30px) 28px; background: #FFFFFF; border: 1px solid #37821E; border-radius: 10px">
<div style="display: flex; align-items: center; justify-content: center; gap: 20px"><span aria-hidden="true" style="flex: 0 0 40px; border-bottom: 3px double #007C36"></span><h3 style="margin: 0; font-family: 'Hiragino Maru Gothic ProN', 'ヒラギノ丸ゴ ProN W4', 'Zen Maru Gothic', sans-serif; font-size: 20px; font-weight: 700; line-height: 1.3; color: #007C36; text-align: center">{{j.name}}</h3><span aria-hidden="true" style="flex: 0 0 40px; border-bottom: 3px double #007C36"></span></div>
<p style="margin: 0; text-align: center"><span style="padding: 8px; background: {{j.tagBg}}; color: #333333; font-size: {{c.fsTag}}; line-height: 1">{{j.tag}}</span></p>
<p style="margin: 0; padding: 0 5px">{{j.lead}}</p>
<ul style="margin: 0; padding: 0 0 0 26px">
<sc-for list="{{j.tasks}}" as="t" hint-placeholder-count="4">
<li style="margin: 0 0 6px">{{t.label}}</li>
</sc-for>
</ul>
<button type="button" onClick="{{j.go}}" style="align-self: center; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; width: min(100%, 296px); min-height: 53px; padding: 12px 25px 12px 15px; border: 1px solid #007C36; border-radius: 3px; background: #007C36; color: #FFFFFF; font-size: 17px; font-weight: 700; line-height: 1.5">{{j.name}}<span style="margin-left: 14px; font-size: 14px">募集要項</span></button>
</div>
</sc-for>
</div>
</div>

<div id="places" style="margin-top: 40px; background: #FAF7F4">
<div style="max-width: 960px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 40px 60px">
<h2 style="margin: 0 0 25px; padding: 0 0 10px; font-family: 'Yu Mincho', '游明朝', 'Hiragino Mincho ProN', 'Noto Serif JP', serif; font-size: clamp(22px, 3.4vw, 27px); font-weight: 700; line-height: 1.8; text-align: center; word-break: keep-all; overflow-wrap: anywhere">医療法人あさなぎ会<wbr>　勤務地のご案内</h2>
<p style="margin: 0; text-align: center; font-size: 14px; line-height: 1.8; color: {{c.lg}}">お住まいの地方をお選びください。</p>
<div role="group" aria-label="地方" style="margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center">
<sc-for list="{{areas}}" as="a" hint-placeholder-count="4">
<button type="button" onClick="{{a.pick}}" aria-pressed="{{a.pressed}}" style="min-height: 44px; padding: 0 18px; border: 1px solid {{a.bd}}; border-radius: 22px; background: {{a.bg}}; color: {{a.fg}}; font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif; font-size: 14px; font-weight: 500">{{a.label}}</button>
</sc-for>
</div>
<sc-if value="{{is.better}}" hint-placeholder-val="{{false}}">
<div style="margin-top: 14px; display: flex; justify-content: center">
<button type="button" onClick="{{go.onlyOpen}}" aria-pressed="{{only.pressed}}" style="min-height: 44px; padding: 0 16px; border: 1px solid #007C36; border-radius: 3px; background: {{only.bg}}; color: {{only.fg}}; font-size: 14px">{{only.label}}</button>
</div>
</sc-if>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="padding: 36px 0 8px; font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 0 12px; margin: 0 0 16px; border-bottom: 1px solid #C2E0CF">
<h3 style="margin: 0; font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: clamp(23px, 3.4vw, 28px); font-weight: 600; line-height: 1.3; letter-spacing: .05em; color: #007C36">{{g.label}}</h3>
<span style="font-size: 12.5px; color: {{c.lg}}">{{g.count}}院</span>
</div>
<div style="background: #FFFFFF; border: 1px solid #D5D5D5; padding: 8px">
<div class="pc-only" style="display: flex; gap: 20px; padding: 20px; border-top: 1px solid #333333; font-size: 18px; font-weight: 700; line-height: 1.8">
<span style="flex: 0 0 150px">院</span><span style="flex: 0 0 170px">住所</span><span style="flex: 1 1 240px">アクセス</span><span style="flex: 0 0 270px">募集中の職種</span>
</div>
<sc-for list="{{g.rows}}" as="c" hint-placeholder-count="4">
<div style="display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; padding: 10px; margin-top: -1px; background: {{c.bg}}; border-top: 1px solid #007C36; border-bottom: 1px solid #007C36">
<h4 style="flex: 1 0 150px; margin: 0; font-size: 18px; font-weight: 700; line-height: 1.8">{{c.name}}</h4>
<span style="flex: 1 0 170px; min-width: 0"><span class="sp-only" style="display: {{lab.d}}; font-size: 14px; color: #666666">住所：</span>{{c.addr}}</span>
