<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF">
<title>こやぎ整骨院｜ホームページの見本</title>
<meta name="description" content="整骨院のホームページの見本です。院名・受付時間・料金は仮のものです。">
<meta property="og:type" content="website">
<meta property="og:title" content="こやぎ整骨院｜ホームページの見本">
<meta property="og:description" content="整骨院のホームページの見本です。院名・受付時間・料金は仮のものです。">
<meta property="og:image" content="https://mkohei97.github.io/works/seikotsuin/img/s_hero.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>body{margin:0}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=Zen+Kaku+Gothic+New:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#17685A}a:hover{color:#1D2B2A}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
:focus-visible{outline:3px solid #F2B544;outline-offset:2px}
h1,h2,h3,dt,button{word-break:auto-phrase}
p,li,dd{text-wrap:pretty}
@media (max-width:759px){.pc-only{display:none !important}
.m-first{order:-1}
.swipe{display:flex !important;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-inline:-16px !important;padding:4px 16px 14px !important;scroll-padding-inline:16px}
.swipe::-webkit-scrollbar{display:none}
.swipe>*{flex:0 0 76%;box-sizing:border-box;scroll-snap-align:start}}
@media (min-width:760px){.sp-only{display:none !important}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(23,104,90,.55)}70%{box-shadow:0 0 0 10px rgba(23,104,90,0)}100%{box-shadow:0 0 0 0 rgba(23,104,90,0)}}
.kb{animation:kb 24s ease-in-out infinite alternate;will-change:transform}
.intro>*{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.intro>*:nth-child(2){animation-delay:.1s}.intro>*:nth-child(3){animation-delay:.2s}.intro>*:nth-child(4){animation-delay:.3s}.intro>*:nth-child(5){animation-delay:.4s}.intro>*:nth-child(6){animation-delay:.5s}
.dot{animation:pulse 2.2s ease-out infinite}
.tap{transition:transform .15s,background-color .15s,color .15s}.tap:active{transform:scale(.97)}
.fx .rv{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.fx .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}.fx .rv{opacity:1;transform:none}}
</style>
<style>
:root{color-scheme:light}
html{-webkit-text-size-adjust:100%;background:#FFFFFF}
@media (prefers-reduced-motion:no-preference){button{transition:background-color .15s,color .15s,border-color .15s}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div id="top" style="background: #FFFFFF; color: #1D2B2A; font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif; font-weight: 400; font-size: 17px; line-height: 1.9; line-break: strict; overflow-x: hidden">

<div style="background: #1D2B2A; color: #FFFFFF; padding: 8px 16px; font-size: 14px; line-height: 1.6; text-align: center">見本のページです。院名・受付時間・料金・住所・電話番号は、仮のものです。</div>

<header style="background: #FFFFFF; border-bottom: 1px solid #CFE0DA">
<div style="max-width: 1160px; margin: 0 auto; padding: 0 16px; min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<button type="button" class="tap" onClick="{{go.home}}" aria-label="トップページへ" style="display: flex; align-items: center; gap: 12px; min-height: 48px; min-width: 0; padding: 0; border: 0; background: transparent; color: #1D2B2A; text-align: left">
<svg viewBox="0 0 44 44" aria-hidden="true" style="width: 42px; height: 42px; flex: 0 0 auto"><rect x="1" y="1" width="42" height="42" rx="12" fill="#17685A"></rect><path d="M12 28c4-9 16-9 20 0" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"></path><circle cx="22" cy="15" r="3.4" fill="#F2B544"></circle></svg>
<span style="display: flex; flex-direction: column; min-width: 0"><span style="font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.3; letter-spacing: .06em; white-space: nowrap">こやぎ整骨院</span><span style="font-size: 13px; line-height: 1.4; letter-spacing: .1em; color: #4A5C59">ほねつぎ・柔道整復師の施術所</span></span>
</button>
<nav class="pc-only" aria-label="主なメニュー" style="display: flex; align-items: center; gap: 2px">
<button type="button" class="tap" onClick="{{go.hours}}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #1D2B2A; font-size: 15px">受付時間</button>
<button type="button" class="tap" onClick="{{go.first}}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #1D2B2A; font-size: 15px">はじめての方へ</button>
<button type="button" class="tap" onClick="{{go.insurance}}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #1D2B2A; font-size: 15px">保険と料金</button>
<button type="button" class="tap" onClick="{{go.inside}}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #1D2B2A; font-size: 15px">院内のご案内</button>
<button type="button" class="tap" onClick="{{go.access}}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #1D2B2A; font-size: 15px">アクセス</button>
</nav>
<div class="pc-only" style="display: flex; align-items: center; gap: 16px">
<span style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1.3"><span style="font-size: 20px; font-weight: 700; letter-spacing: .04em">00-0000-0000</span><span style="font-size: 13px; color: #4A5C59">予約優先</span></span>
<button type="button" class="tap" onClick="{{go.reserve}}" style="min-height: 46px; padding: 0 22px; border: 0; border-radius: 10px; background: #17685A; color: #FFFFFF; font-size: 15px; font-weight: 700">予約する</button>
</div>
<button type="button" class="sp-only tap" onClick="{{go.toggle}}" aria-expanded="{{menuOpen}}" style="flex: 0 0 auto; min-width: 84px; min-height: 44px; border: 1px solid #1D2B2A; border-radius: 10px; background: #FFFFFF; color: #1D2B2A; font-size: 14px; font-weight: 700">{{menuLabel}}</button>
</div>
<sc-if value="{{is.menu}}" hint-placeholder-val="{{false}}">
<nav class="sp-only" aria-label="メニュー" style="display: flex; flex-direction: column; border-top: 1px solid #CFE0DA">
<button type="button" onClick="{{go.hours}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #E3EEEA; background: #FFFFFF; color: #1D2B2A; font-size: 16px; text-align: left">受付時間</button>
<button type="button" onClick="{{go.greet}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #E3EEEA; background: #FFFFFF; color: #1D2B2A; font-size: 16px; text-align: left">院長より</button>
<button type="button" onClick="{{go.first}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #E3EEEA; background: #FFFFFF; color: #1D2B2A; font-size: 16px; text-align: left">はじめての方へ</button>
<button type="button" onClick="{{go.insurance}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #E3EEEA; background: #FFFFFF; color: #1D2B2A; font-size: 16px; text-align: left">保険と料金</button>
<button type="button" onClick="{{go.inside}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #E3EEEA; background: #FFFFFF; color: #1D2B2A; font-size: 16px; text-align: left">院内のご案内</button>
<button type="button" onClick="{{go.faq}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #E3EEEA; background: #FFFFFF; color: #1D2B2A; font-size: 16px; text-align: left">よくあるご質問</button>
<button type="button" onClick="{{go.access}}" style="min-height: 54px; padding: 0 18px; border: 0; background: #FFFFFF; color: #1D2B2A; font-size: 16px; text-align: left">アクセス</button>
</nav>
</sc-if>
</header>

<sc-if value="{{is.home}}" hint-placeholder-val="{{true}}">
<main>

<section style="background: #EEF6F3; display: flex; flex-wrap: wrap; align-items: stretch">
<div class="intro" style="flex: 1 1 400px; min-width: 0; box-sizing: border-box; padding: clamp(26px, 5vw, 56px) 20px clamp(30px, 5vw, 52px) max(20px, calc((100vw - 1160px) / 2 + 16px)); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 16px">
<p style="margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .08em; color: #17685A">こやぎ整骨院｜◯◯駅から歩いて5分</p>
<h1 style="margin: 0; font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif; font-size: clamp(24px, 3vw, 34px); font-weight: 700; line-height: 1.55; letter-spacing: .02em">ひねった、ぶつけた、転んだ。<br>お気軽にご相談ください。</h1>
<button type="button" class="tap" onClick="{{go.greet}}" style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 4px 18px 4px 4px; border: 1px solid #CFE0DA; border-radius: 999px; background: #FFFFFF; color: #1D2B2A; text-align: left">
<img src="img/s_face.jpg" alt="院長の似顔絵（見本）" style="width: 56px; height: 56px; flex: 0 0 auto; border-radius: 50%; object-fit: cover">
<span style="display: flex; flex-direction: column; min-width: 0; line-height: 1.5"><span style="font-size: 14px; color: #4A5C59">院長・柔道整復師（国家資格）</span><span style="font-size: 17px; font-weight: 700">（院長のお名前）が伺います</span></span>
</button>
<p style="margin: 0; max-width: 30em; font-size: 17px">「これくらいで行っていいのかな」と迷ったら、どうぞそのままお越しください。お話を伺ってから、施術します。</p>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 16px; background: #FFFFFF; border-radius: 12px">
<span style="display: inline-flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; color: {{now.fg}}"><span class="{{now.dot}}" aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: {{now.fg}}"></span>{{now.label}}</span>
<span style="font-size: 16px">{{now.today}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<button type="button" class="tap" onClick="{{go.reserve}}" style="min-height: 54px; padding: 0 28px; border: 0; border-radius: 10px; background: #17685A; color: #FFFFFF; font-size: 17px; font-weight: 700">予約する</button>
<button type="button" class="tap" onClick="{{go.hours}}" style="min-height: 54px; padding: 0 28px; border: 1px solid #1D2B2A; border-radius: 10px; background: #FFFFFF; color: #1D2B2A; font-size: 17px; font-weight: 700">受付時間を見る</button>
</div>
</div>
<div class="m-first" style="flex: 1.2 1 420px; min-width: 0; min-height: clamp(210px, 56vw, 300px); position: relative; overflow: hidden">
<img class="kb" src="img/s_hero.jpg" alt="院内の受付と待合。木の受付台と椅子があり、大きな窓から光が入る" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 70% 50%">
</div>
</section>

<section id="hours" style="padding: 68px 0 60px">
<div class="rv" style="max-width: 900px; margin: 0 auto; padding: 0 16px">
<p style="margin: 0; color: #17685A; font-size: 14px; font-weight: 700; letter-spacing: .14em">受付時間</p>
<h2 style="margin: 4px 0 18px; font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif; font-size: clamp(26px, 3.6vw, 34px); font-weight: 700; line-height: 1.5">施術日と受付時間</h2>
<div role="table" aria-label="曜日ごとの受付時間" style="text-align: center; font-size: 16px; border-radius: 10px; overflow: hidden">
<div role="row" style="display: grid; grid-template-columns: minmax(118px, 2.2fr) repeat(7, minmax(0, 1fr)); white-space: nowrap">
<div role="columnheader" style="padding: 10px 4px; background: #17685A; color: #FFFFFF; font-weight: 700">受付時間</div>
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<div role="columnheader" style="padding: 10px 2px; background: {{d.hbg}}; color: {{d.hfg}}; font-weight: 700">{{d.name}}</div>
</sc-for>
</div>
<div role="row" style="display: grid; grid-template-columns: minmax(118px, 2.2fr) repeat(7, minmax(0, 1fr)); white-space: nowrap; border-bottom: 1px solid #CFE0DA">
<div role="rowheader" style="padding: 14px 4px; font-weight: 700; line-height: 1.6">9:00〜12:00</div>
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<div role="cell" style="padding: 12px 2px; background: {{d.bg}}; font-size: 18px; font-weight: 700; color: {{d.amc}}">{{d.am}}</div>
</sc-for>
</div>
<div role="row" style="display: grid; grid-template-columns: minmax(118px, 2.2fr) repeat(7, minmax(0, 1fr)); white-space: nowrap; border-bottom: 1px solid #CFE0DA">
<div role="rowheader" style="padding: 14px 4px; font-weight: 700; line-height: 1.6">16:00〜20:00</div>
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<div role="cell" style="padding: 12px 2px; background: {{d.bg}}; font-size: 18px; font-weight: 700; color: {{d.pmc}}">{{d.pm}}</div>
</sc-for>
</div>
</div>
<p style="margin: 12px 0 0; font-size: 16px; color: #4A5C59">○＝受付　休＝休み。水曜と土曜の午後、日曜・祝日は休みです。色のついた列が今日です。</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 22px">
<sc-for list="{{points}}" as="p" hint-placeholder-count="3">
<div style="padding: 16px 18px; background: #EEF6F3; border-radius: 12px; line-height: 1.6"><div style="font-size: 18px; font-weight: 700">{{p.k}}</div><div style="font-size: 15px; color: #4A5C59">{{p.v}}</div></div>
</sc-for>
</div>
</div>
</section>

<section id="greet" style="padding: 4px 16px 64px">
<div class="rv" style="max-width: 940px; box-sizing: border-box; margin: 0 auto; padding: clamp(24px, 4vw, 40px) clamp(18px, 4vw, 44px); background: #EEF6F3; border-radius: 20px; display: flex; flex-wrap: wrap; gap: 24px 44px; align-items: center">
<figure style="flex: 0 1 240px; min-width: 180px; margin: 0 auto">
<img src="img/s_face.jpg" alt="院長の似顔絵（見本）。白い施術着で、やわらかく笑っている" loading="lazy" decoding="async" style="display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 50%; border: 6px solid #FFFFFF">
<figcaption style="margin-top: 8px; font-size: 14px; line-height: 1.6; color: #4A5C59; text-align: center">見本のイラストです。<br>実際は、院長のお写真が入ります。</figcaption>
</figure>
<div style="flex: 1.6 1 360px; min-width: 0">
<p style="margin: 0; color: #17685A; font-size: 14px; font-weight: 700; letter-spacing: .14em">院長より</p>
<h2 style="margin: 4px 0 14px; font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif; font-size: clamp(26px, 3.6vw, 34px); font-weight: 700; line-height: 1.5">迷ったら、まず声をかけてください。</h2>
<p style="margin: 0 0 12px; font-size: 17px">けがをしたとき、「これくらいで行っていいのかな」と迷う方は少なくありません。そんなときこそ、お気軽にご相談ください。</p>
<p style="margin: 0 0 16px; font-size: 17px">はじめにお話をよく伺い、施術の内容をご説明してから進めます。医療機関での検査が必要だと考えたときは、その場でお伝えします。</p>
<p style="margin: 0; line-height: 1.7"><span style="display: block; font-size: 15px; color: #4A5C59">院長・柔道整復師（国家資格）</span><span style="font-size: 21px; font-weight: 700">（院長のお名前）</span></p>
</div>
</div>
</section>

<section id="first" style="background: #EEF6F3; padding: 64px 0 64px">
<div class="rv" style="max-width: 1160px; margin: 0 auto; padding: 0 16px">
<p style="margin: 0; color: #17685A; font-size: 14px; font-weight: 700; letter-spacing: .14em">はじめての方へ</p>
<h2 style="margin: 4px 0 6px; font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif; font-size: clamp(26px, 3.6vw, 34px); font-weight: 700; line-height: 1.5">ご来院から施術までの流れ</h2>
<p style="margin: 0 0 6px; font-size: 16px; color: #4A5C59">はじめての方は、受付からお帰りまで40分ほどみてください。</p>
<p class="sp-only" style="margin: 0; font-size: 14px; color: #4A5C59">横に動かして、順にご覧ください。</p>
<ol class="swipe" style="margin: 18px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px">
<sc-for list="{{flow}}" as="f" hint-placeholder-count="5">
<li style="padding: 20px 18px; background: #FFFFFF; border-radius: 12px">
<p style="margin: 0; display: inline-block; min-width: 34px; padding: 0 10px; border-radius: 999px; background: #17685A; color: #FFFFFF; font-size: 15px; font-weight: 700; line-height: 1.8; text-align: center">{{f.n}}</p>
<h3 style="margin: 8px 0 4px; font-size: 19px; font-weight: 700; line-height: 1.6">{{f.k}}</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.8; color: #2F403D">{{f.v}}</p>
</li>
</sc-for>
</ol>
<div style="margin-top: 20px; padding: 18px 20px; background: #FFFFFF; border-left: 0; border-radius: 12px">
<h3 style="margin: 0 0 4px; font-size: 18px; font-weight: 700">お持ちいただくもの</h3>
<p style="margin: 0; font-size: 16px">健康保険証（またはマイナ保険証）をお持ちください。動きやすい服装でお越しいただくと、スムーズです。</p>
</div>
</div>
</section>

<section id="insurance" style="padding: 68px 0 60px">
<div class="rv" style="max-width: 1000px; margin: 0 auto; padding: 0 16px">
<p style="margin: 0; color: #17685A; font-size: 14px; font-weight: 700; letter-spacing: .14em">保険と料金</p>
<h2 style="margin: 4px 0 18px; font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif; font-size: clamp(26px, 3.6vw, 34px); font-weight: 700; line-height: 1.5">健康保険と、自費の施術について</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
<article style="padding: 24px 22px; border: 1px solid #CFE0DA; border-radius: 14px">
<h3 style="margin: 0 0 8px; font-size: 20px; font-weight: 700">健康保険が使える場合</h3>
<p style="margin: 0 0 10px; font-size: 16px">外傷性が明らかな骨折、脱臼、打撲、捻挫等は、医療保険の療養費支給申請の対象となります。</p>
<p style="margin: 0; padding: 12px 14px; background: #EEF6F3; border-radius: 10px; font-size: 16px">骨折・脱臼の患部の施術には、応急手当を除き、医師の同意が必要です。</p>
</article>
<article style="padding: 24px 22px; border: 1px solid #CFE0DA; border-radius: 14px">
<h3 style="margin: 0 0 8px; font-size: 20px; font-weight: 700">自費の施術</h3>
<p style="margin: 0 0 10px; font-size: 16px">保険の対象にならない場合は、自費の施術となります。内容と料金は、施術の前にご説明します。</p>
<dl style="margin: 0; border-top: 1px solid #CFE0DA">
<sc-for list="{{fees}}" as="f" hint-placeholder-count="3">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; border-bottom: 1px solid #CFE0DA"><dt style="min-width: 0; font-size: 16px">{{f.k}}</dt><dd style="flex: 0 0 auto; margin: 0; font-size: 18px; font-weight: 700">{{f.v}}</dd></div>
</sc-for>
</dl>
<p style="margin: 8px 0 0; font-size: 14px; color: #4A5C59">料金は税込です（見本の金額）。</p>
</article>
</div>
</div>
</section>

<section id="inside" style="background: #EEF6F3; padding: 64px 0 64px">
<div class="rv" style="max-width: 1160px; margin: 0 auto; padding: 0 16px; display: flex; flex-wrap: wrap; gap: 28px 44px; align-items: center">
<div style="flex: 1 1 340px; min-width: 0">
<img src="img/s_room.jpg" alt="施術室。白いタオルを敷いたベッドが3台並び、淡い緑のカーテンで仕切られている" loading="lazy" decoding="async" style="display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 14px">
</div>
<div style="flex: 1.1 1 380px; min-width: 0">
