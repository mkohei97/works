<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF">
<title>はまかぜ住器｜ホームページの見本</title>
<meta name="description" content="窓・玄関・外まわりの工事の会社のホームページの見本です。会社名・費用は仮のものです。">
<meta property="og:type" content="website">
<meta property="og:title" content="はまかぜ住器｜ホームページの見本">
<meta property="og:description" content="窓・玄関・外まわりの工事の会社のホームページの見本です。会社名・費用は仮のものです。">
<meta property="og:image" content="https://mkohei97.github.io/works/window-exterior/img/h_hero.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>body{margin:0}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#0B5C8E}a:hover{color:#1B2530}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
:focus-visible{outline:3px solid #F0A040;outline-offset:2px}
h1,h2,h3,dt,button{word-break:auto-phrase}
p,li,dd{text-wrap:pretty}
@media (max-width:759px){.pc-only{display:none !important}
.m-first{order:-1}
.swipe{display:flex !important;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-inline:-16px !important;padding:4px 16px 14px !important;scroll-padding-inline:16px}
.swipe::-webkit-scrollbar{display:none}
.swipe>*{flex:0 0 80%;box-sizing:border-box;scroll-snap-align:start}}
@media (min-width:760px){.sp-only{display:none !important}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.kb{animation:kb 24s ease-in-out infinite alternate;will-change:transform}
.intro>*{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.intro>*:nth-child(2){animation-delay:.1s}.intro>*:nth-child(3){animation-delay:.2s}.intro>*:nth-child(4){animation-delay:.3s}
.tap{transition:transform .15s,background-color .15s,color .15s}.tap:active{transform:scale(.97)}
.card{transition:transform .3s,box-shadow .3s}
.card img{transition:transform .9s cubic-bezier(.2,.7,.2,1)}
@media (hover:hover){.card:hover{box-shadow:0 10px 24px rgba(27,37,48,.14)}.card:hover img{transform:scale(1.05)}}
.fx .rv{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.fx .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}.fx .rv{opacity:1;transform:none}}
</style>
<style>
:root{color-scheme:light}
html{-webkit-text-size-adjust:100%;background:#FFFFFF}
@media (prefers-reduced-motion:no-preference){button{transition:background-color .15s,color .15s,border-color .15s}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div id="top" style="background: #FFFFFF; color: #1B2530; font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif; font-weight: 400; font-size: 17px; line-height: 1.9; line-break: strict; overflow-x: hidden">

<div style="background: #1B2530; color: #FFFFFF; padding: 8px 16px; font-size: 14px; line-height: 1.6; text-align: center">見本のページです。会社名・施工事例・費用・住所・電話番号は、仮のものです。</div>

<header style="background: #FFFFFF; border-bottom: 1px solid #CBD9E3">
<div style="max-width: 1160px; margin: 0 auto; padding: 0 16px; min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<button type="button" class="tap" onClick="{{go.home}}" aria-label="トップページへ" style="display: flex; align-items: center; gap: 12px; min-height: 48px; min-width: 0; padding: 0; border: 0; background: transparent; color: #1B2530; text-align: left">
<svg viewBox="0 0 44 44" aria-hidden="true" style="width: 42px; height: 42px; flex: 0 0 auto"><rect x="2" y="2" width="40" height="40" rx="4" fill="#0B5C8E"></rect><path d="M10 10h24v24H10zM22 10v24M10 22h24" fill="none" stroke="#FFFFFF" stroke-width="2.4"></path></svg>
<span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 13px; line-height: 1.4; letter-spacing: .1em; color: #46566A">窓・玄関・外まわり・水まわり</span><span style="font-size: 21px; font-weight: 900; line-height: 1.3; letter-spacing: .04em; white-space: nowrap">はまかぜ住器</span></span>
</button>
<nav class="pc-only" aria-label="主なメニュー" style="display: flex; align-items: center; gap: 2px">
<button type="button" class="tap" onClick="{{go.works}}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #1B2530; font-size: 15px; font-weight: 500">対応工事</button>
<button type="button" class="tap" onClick="{{go.cases}}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #1B2530; font-size: 15px; font-weight: 500">施工事例</button>
<button type="button" class="tap" onClick="{{go.flow}}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #1B2530; font-size: 15px; font-weight: 500">ご相談の流れ</button>
<button type="button" class="tap" onClick="{{go.company}}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #1B2530; font-size: 15px; font-weight: 500">会社概要</button>
</nav>
<div class="pc-only" style="display: flex; align-items: center; gap: 16px">
<span style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1.3"><span style="font-size: 20px; font-weight: 700; letter-spacing: .04em">00-0000-0000</span><span style="font-size: 13px; color: #46566A">受付 9:00〜17:00（土・日・祝日は休み）</span></span>
<button type="button" class="tap" onClick="{{go.ask}}" style="min-height: 46px; padding: 0 22px; border: 0; border-radius: 6px; background: #B84A0E; color: #FFFFFF; font-size: 15px; font-weight: 700">相談・見積</button>
</div>
<button type="button" class="sp-only tap" onClick="{{go.toggle}}" aria-expanded="{{menuOpen}}" style="flex: 0 0 auto; min-width: 84px; min-height: 44px; border: 1px solid #1B2530; border-radius: 6px; background: #FFFFFF; color: #1B2530; font-size: 14px; font-weight: 700">{{menuLabel}}</button>
</div>
<sc-if value="{{is.menu}}" hint-placeholder-val="{{false}}">
<nav class="sp-only" aria-label="メニュー" style="display: flex; flex-direction: column; border-top: 1px solid #CBD9E3">
<button type="button" onClick="{{go.works}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #E1EAF0; background: #FFFFFF; color: #1B2530; font-size: 16px; text-align: left">対応工事</button>
<button type="button" onClick="{{go.cases}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #E1EAF0; background: #FFFFFF; color: #1B2530; font-size: 16px; text-align: left">施工事例</button>
<button type="button" onClick="{{go.subsidy}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #E1EAF0; background: #FFFFFF; color: #1B2530; font-size: 16px; text-align: left">補助金について</button>
<button type="button" onClick="{{go.flow}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #E1EAF0; background: #FFFFFF; color: #1B2530; font-size: 16px; text-align: left">ご相談の流れ</button>
<button type="button" onClick="{{go.faq}}" style="min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid #E1EAF0; background: #FFFFFF; color: #1B2530; font-size: 16px; text-align: left">よくあるご質問</button>
<button type="button" onClick="{{go.company}}" style="min-height: 54px; padding: 0 18px; border: 0; background: #FFFFFF; color: #1B2530; font-size: 16px; text-align: left">会社概要</button>
</nav>
</sc-if>
</header>

<sc-if value="{{is.home}}" hint-placeholder-val="{{true}}">
<main>

<section style="background: #EEF4F8; display: flex; flex-wrap: wrap; align-items: stretch">
<div class="intro" style="flex: 1 1 400px; min-width: 0; box-sizing: border-box; padding: clamp(26px, 5vw, 60px) 20px clamp(30px, 5vw, 56px) max(20px, calc((100vw - 1160px) / 2 + 16px)); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 16px">
<p style="margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .1em; color: #0B5C8E">創業 昭和◯年　◯◯市の建具と外構の会社</p>
<h1 style="margin: 0; font-size: clamp(28px, 3.7vw, 42px); font-weight: 900; line-height: 1.45; letter-spacing: .02em">窓、玄関、外まわり。<br>住まいの工事を、<br>ひとつの窓口で。</h1>
<p style="margin: 0; max-width: 31em; font-size: 17px">網戸の張り替え1枚から、窓や玄関ドアの取替え、カーポートやフェンスの工事、キッチンや浴室の入替えまで承ります。</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<button type="button" class="tap" onClick="{{go.ask}}" style="min-height: 54px; padding: 0 28px; border: 0; border-radius: 6px; background: #B84A0E; color: #FFFFFF; font-size: 17px; font-weight: 700">相談・見積を頼む</button>
<button type="button" class="tap" onClick="{{go.cases}}" style="min-height: 54px; padding: 0 28px; border: 1px solid #1B2530; border-radius: 6px; background: #FFFFFF; color: #1B2530; font-size: 17px; font-weight: 700">施工事例を見る</button>
</div>
</div>
<div class="m-first" style="flex: 1.25 1 420px; min-width: 0; min-height: clamp(210px, 56vw, 320px); position: relative; overflow: hidden">
<img class="kb" src="img/h_hero.jpg" alt="玄関ドア、木目のフェンス、カーポート、デッキのある住宅の外観" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 55% 60%">
</div>
</section>

<section aria-label="会社のこと" style="background: #0B5C8E; color: #FFFFFF">
<div style="max-width: 1160px; margin: 0 auto; padding: 18px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 28px">
<sc-for list="{{facts}}" as="f" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; line-height: 1.6"><span style="font-size: 14px; letter-spacing: .08em; color: #D6E6F2">{{f.k}}</span><span style="font-size: 18px; font-weight: 700">{{f.v}}</span></div>
</sc-for>
</div>
</section>

<section id="works" style="padding: 68px 0 60px">
<div style="max-width: 1160px; margin: 0 auto; padding: 0 16px">
<div class="rv">
<p style="margin: 0; color: #0B5C8E; font-size: 14px; font-weight: 700; letter-spacing: .14em">対応工事</p>
<h2 style="margin: 4px 0 6px; font-size: clamp(26px, 3.6vw, 34px); font-weight: 900; line-height: 1.5">頼める工事</h2>
<p style="margin: 0 0 24px; font-size: 16px; color: #46566A">ここに無い工事も、まずはご相談ください。</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
<sc-for list="{{works}}" as="w" hint-placeholder-count="6">
<article class="rv" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 22px 20px; border: 1px solid #CBD9E3; border-radius: 10px; transition-delay: {{w.dl}}">
<h3 style="margin: 0; display: flex; align-items: center; gap: 12px; font-size: 21px; font-weight: 900; line-height: 1.5"><span aria-hidden="true" style="flex: 0 0 auto; width: 10px; height: 26px; border-radius: 3px; background: #0B5C8E"></span>{{w.k}}</h3>
<p style="margin: 0; flex: 1 1 auto; font-size: 16px; line-height: 1.8; color: #2C3A48">{{w.v}}</p>
<button type="button" class="tap" onClick="{{w.ask}}" style="align-self: flex-start; min-height: 46px; padding: 0 18px; border: 1px solid #0B5C8E; border-radius: 6px; background: #FFFFFF; color: #0B5C8E; font-size: 15px; font-weight: 700">この工事を相談する</button>
</article>
</sc-for>
</div>
</div>
</section>

<section id="cases" style="background: #EEF4F8; padding: 64px 0 64px">
<div style="max-width: 1160px; margin: 0 auto; padding: 0 16px">
<div class="rv">
<p style="margin: 0; color: #0B5C8E; font-size: 14px; font-weight: 700; letter-spacing: .14em">施工事例</p>
<h2 style="margin: 4px 0 14px; font-size: clamp(26px, 3.6vw, 34px); font-weight: 900; line-height: 1.5">工期と費用の目安つきで、ご紹介します。</h2>
<div role="group" aria-label="施工事例の絞り込み" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button type="button" class="tap" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="min-height: 46px; padding: 0 18px; border: 1px solid #1B2530; border-radius: 999px; background: {{t.bg}}; color: {{t.fg}}; font-size: 16px; font-weight: 700">{{t.label}}</button>
</sc-for>
</div>
<p class="sp-only" style="margin: 10px 0 0; font-size: 14px; color: #46566A">横に動かして、ほかの事例もご覧ください。</p>
</div>
<div class="swipe" style="margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px">
<sc-for list="{{cases}}" as="c" hint-placeholder-count="6">
<article class="card" style="display: flex; flex-direction: column; background: #FFFFFF; border-radius: 10px; overflow: hidden">
<div style="overflow: hidden"><img src="{{c.img}}" alt="{{c.alt}}" loading="lazy" decoding="async" style="display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover"></div>
<div style="display: flex; flex-direction: column; gap: 8px; flex: 1 1 auto; padding: 18px 20px 20px">
<p style="margin: 0; align-self: flex-start; padding: 0 12px; border-radius: 999px; background: #E3EEF6; color: #0B5C8E; font-size: 14px; font-weight: 700; line-height: 1.9">{{c.cat}}</p>
<h3 style="margin: 0; font-size: 19px; font-weight: 700; line-height: 1.6">{{c.title}}</h3>
<p style="margin: 0; flex: 1 1 auto; font-size: 16px; line-height: 1.8; color: #2C3A48">{{c.body}}</p>
<dl style="margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
<div style="padding: 8px 12px; background: #EEF4F8; border-radius: 6px; line-height: 1.5"><dt style="font-size: 14px; color: #46566A">工期</dt><dd style="margin: 0; font-size: 18px; font-weight: 700">{{c.term}}</dd></div>
<div style="padding: 8px 12px; background: #EEF4F8; border-radius: 6px; line-height: 1.5"><dt style="font-size: 14px; color: #46566A">費用の目安（税別）</dt><dd style="margin: 0; font-size: 18px; font-weight: 700">{{c.cost}}</dd></div>
</dl>
<button type="button" class="tap" onClick="{{c.ask}}" style="min-height: 46px; border: 1px solid #0B5C8E; border-radius: 6px; background: #FFFFFF; color: #0B5C8E; font-size: 15px; font-weight: 700">同じような工事を相談する</button>
</div>
</article>
</sc-for>
</div>
<p style="margin: 14px 0 0; font-size: 15px; color: #46566A">費用は、商品代と施工費を含む過去の工事の記録です。現場の条件や製品によって、費用と工期は変わります。</p>
</div>
</section>

<section id="subsidy" style="padding: 60px 0 56px">
<div class="rv" style="max-width: 1000px; margin: 0 auto; padding: 0 16px; display: flex; flex-wrap: wrap; gap: 24px 44px; align-items: center">
<div style="flex: 1 1 320px; min-width: 0">
<img src="img/h_window.jpg" alt="今ある窓の内側に、白い内窓を取り付けた居間の窓" loading="lazy" decoding="async" style="display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px">
</div>
<div style="flex: 1.2 1 380px; min-width: 0">
<p style="margin: 0; color: #0B5C8E; font-size: 14px; font-weight: 700; letter-spacing: .14em">補助金について</p>
<h2 style="margin: 4px 0 12px; font-size: clamp(24px, 3.2vw, 30px); font-weight: 900; line-height: 1.5">窓の断熱の工事は、補助金の対象になる場合があります。</h2>
<p style="margin: 0 0 10px; font-size: 16px">内窓の取付けや窓の取替えには、国や自治体の補助金が使える場合があります。年度によって内容が変わるので、対象になるかどうかを当社で確かめ、申請の手続きまでお手伝いします。</p>
<button type="button" class="tap" onClick="{{go.askWindow}}" style="min-height: 48px; padding: 0 20px; border: 1px solid #0B5C8E; border-radius: 6px; background: #FFFFFF; color: #0B5C8E; font-size: 16px; font-weight: 700">窓の工事を相談する</button>
</div>
</div>
</section>

<section id="flow" style="background: #EEF4F8; padding: 64px 0 64px">
<div class="rv" style="max-width: 1160px; margin: 0 auto; padding: 0 16px">
<p style="margin: 0; color: #0B5C8E; font-size: 14px; font-weight: 700; letter-spacing: .14em">ご相談の流れ</p>
<h2 style="margin: 4px 0 6px; font-size: clamp(26px, 3.6vw, 34px); font-weight: 900; line-height: 1.5">ご相談から、お引き渡しまで</h2>
<p class="sp-only" style="margin: 0; font-size: 14px; color: #46566A">横に動かして、順にご覧ください。</p>
<ol class="swipe" style="margin: 18px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px">
<sc-for list="{{flow}}" as="f" hint-placeholder-count="5">
<li style="padding: 20px 18px; background: #FFFFFF; border-radius: 10px; border-top: 4px solid #0B5C8E">
<p style="margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .1em; color: #0B5C8E">手順 {{f.n}}</p>
<h3 style="margin: 2px 0 4px; font-size: 19px; font-weight: 700; line-height: 1.6">{{f.k}}</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.8; color: #2C3A48">{{f.v}}</p>
</li>
</sc-for>
</ol>
</div>
</section>

<section id="faq" style="padding: 64px 0 56px">
<div class="rv" style="max-width: 860px; margin: 0 auto; padding: 0 16px">
<p style="margin: 0; color: #0B5C8E; font-size: 14px; font-weight: 700; letter-spacing: .14em">よくあるご質問</p>
<h2 style="margin: 4px 0 14px; font-size: clamp(26px, 3.6vw, 34px); font-weight: 900; line-height: 1.5">ご相談の前に</h2>
<sc-for list="{{faq}}" as="q" hint-placeholder-count="4">
<details style="border-bottom: 1px solid #CBD9E3">
<summary style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 6px 0; cursor: pointer; font-size: 17px; font-weight: 700; line-height: 1.6; list-style: none"><span aria-hidden="true" style="flex: 0 0 auto; color: #0B5C8E; font-size: 20px; font-weight: 900">Q</span><span style="min-width: 0">{{q.q}}</span></summary>
<p style="margin: 0; padding: 0 0 16px 32px; font-size: 16px">{{q.a}}</p>
</details>
</sc-for>
</div>
</section>

<section id="company" style="background: #EEF4F8; padding: 64px 0 64px">
<div class="rv" style="max-width: 1000px; margin: 0 auto; padding: 0 16px">
<p style="margin: 0; color: #0B5C8E; font-size: 14px; font-weight: 700; letter-spacing: .14em">会社概要</p>
<h2 style="margin: 4px 0 20px; font-size: clamp(26px, 3.6vw, 34px); font-weight: 900; line-height: 1.5">有限会社 はまかぜ住器</h2>
<div style="display: flex; flex-wrap: wrap; gap: 24px 36px; align-items: flex-start">
<dl style="flex: 1.3 1 380px; min-width: 0; margin: 0; padding: 6px 22px; background: #FFFFFF; border-radius: 10px">
<sc-for list="{{company}}" as="s" hint-placeholder-count="7">
<div style="display: flex; flex-wrap: wrap; gap: 2px 20px; padding: 14px 0; border-bottom: 1px solid #E1EAF0">
<dt style="flex: 0 0 6em; font-size: 16px; font-weight: 700; color: #0B5C8E">{{s.k}}</dt>
<dd style="flex: 1 1 220px; min-width: 0; margin: 0; font-size: 16px">{{s.v}}</dd>
</div>
</sc-for>
</dl>
<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="min-height: 150px; box-sizing: border-box; padding: 16px; display: flex; align-items: center; justify-content: center; border: 1px dashed #5F7386; border-radius: 10px; background: #FFFFFF; color: #46566A; font-size: 15px; text-align: center">ここに地図が入ります（Googleマップ）</div>
<div style="padding: 24px 22px; background: #1B2530; color: #FFFFFF; border-radius: 10px">
<h3 style="margin: 0 0 6px; font-size: 20px; font-weight: 900; line-height: 1.5">工事のご相談・お見積り</h3>
<p style="margin: 0 0 14px; font-size: 16px; color: #DCE5EC">工事の内容と現場の地域をお知らせいただくと、ご案内がスムーズです。</p>
<button type="button" class="tap" onClick="{{go.ask}}" style="width: 100%; min-height: 54px; border: 0; border-radius: 6px; background: #FFFFFF; color: #1B2530; font-size: 17px; font-weight: 700">相談・見積のフォームへ</button>
</div>
</div>
</div>
</div>
</section>

</main>
</sc-if>
